<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Hotel — guest card</title>
<meta name="robots" content="noindex,nofollow">
<!-- The sample flyer IS the real, dashboard-generated guest card for the
     "Sample Hotel" demo (slug sample-hotel: bold theme + logo, QR to its live
     page). We render it through the canonical flyer engine (flyer.html) rather
     than a static copy, so the sample can never drift from what hotels get. -->
<link rel="canonical" href="https://shou.be/hotels/flyer?slug=sample-hotel">
<meta http-equiv="refresh" content="0; url=/hotels/flyer?slug=sample-hotel&amp;name=Sample%20Hotel">
<script>location.replace('/hotels/flyer?slug=sample-hotel&name=Sample%20Hotel');</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;color:#5b5566">
  Opening the Sample Hotel guest card…
  <a href="/hotels/flyer?slug=sample-hotel&name=Sample%20Hotel">Continue →</a>
</p>
</body>
</html>
