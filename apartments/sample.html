<style>
  :root{
    --ink:#15101b; --text:#1a1622; --soft:#5b5566; --dim:#6c6577;
    --bg:#ffffff; --card:#ffffff; --panel-soft:#f7f5fa; --line:rgba(20,16,30,0.10);
    --pink:#ff3d8b; --orange:#ff9b3d; --cyan:#0e9a8d; --violet:#9b5cff;
    --grad:linear-gradient(105deg,var(--pink),var(--orange));
    --grad-cool:linear-gradient(120deg,var(--violet),var(--pink));
    --warm-bg:#fce4ed; --warm-bd:#f3bfd2; --warm-ink:#a02a54;
    --cool-bg:#ece5ff; --cool-bd:#d2c3f6; --cool-ink:#4e35a0;
    --mint-bg:#e3f4f1; --mint-bd:#bfe6df; --mint-ink:#0e6b60;
    --chrome:rgba(255,255,255,.9);   /* translucent sticky header */
    --fade:#ffffff;                  /* the fade behind the chat input */
    --shadow:0 1px 3px rgba(20,16,30,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* ---- themes: owner picks one; each is a variable override, never a layout
     change, so a bad choice can still only look different, not broken. ---- */
  body[data-theme="warm"]{
    --ink:#2b1b13; --text:#33241c; --soft:#6d5648; --dim:#786249;
    --bg:#fdf6ef; --card:#fffaf5; --panel-soft:#f6ebe0; --line:rgba(60,35,20,.13);
    --pink:#c2622f; --orange:#e0913f; --grad:linear-gradient(105deg,#c2622f,#e0913f);
    --warm-bg:#f7e3d3; --warm-bd:#e8c4a8; --warm-ink:#8a4218;
    --cool-bg:#efe6f0; --cool-bd:#d9c6da; --cool-ink:#6d3f63;
    --mint-bg:#e9efe3; --mint-bd:#cfdcc3; --mint-ink:#456630;
    --chrome:rgba(253,246,239,.9); --fade:#fdf6ef;
  }
  body[data-theme="warm"] h1,body[data-theme="warm"] h2,body[data-theme="warm"] .hname{font-family:'Lora',Georgia,serif}

  body[data-theme="nordic"]{
    --ink:#1b2430; --text:#26313d; --soft:#5d6b7a; --dim:#556472;
    --bg:#f4f7f9; --card:#ffffff; --panel-soft:#e9eff4; --line:rgba(27,36,48,.12);
    --pink:#3d7ea6; --orange:#6aa3c0; --grad:linear-gradient(105deg,#3d7ea6,#6aa3c0);
    --cool-bg:#e2edf4; --cool-bd:#c3daea; --cool-ink:#255d80;
    --warm-bg:#eeeef1; --warm-bd:#d7dae2; --warm-ink:#4b5566;
    --mint-bg:#e2eff0; --mint-bd:#c2dcdf; --mint-ink:#1f5c63;
    --chrome:rgba(244,247,249,.9); --fade:#f4f7f9;
  }
  body[data-theme="nordic"] h1,body[data-theme="nordic"] h2,body[data-theme="nordic"] .hname{font-family:'Inter',system-ui,sans-serif;letter-spacing:-.02em}

  body[data-theme="bold"]{
    --ink:#f5f3f7; --text:#e8e4ee; --soft:#b3acc0; --dim:#a49cb0;
    --bg:#201c29; --card:#2b2637; --panel-soft:#262231; --line:rgba(255,255,255,.14);
    --pink:#ff4d8d; --orange:#ffb03d; --grad:linear-gradient(105deg,#ff4d8d,#ffb03d);
    --warm-bg:#3a2130; --warm-bd:#5a3247; --warm-ink:#ffb3cd;
    --cool-bg:#241f3a; --cool-bd:#3b3260; --cool-ink:#c9bcff;
    --mint-bg:#123330; --mint-bd:#1d4f49; --mint-ink:#7fd8cb;
    --chrome:rgba(32,28,41,.9); --fade:#201c29;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  body[data-theme="bold"] h1,body[data-theme="bold"] h2,body[data-theme="bold"] .hname{font-family:'Space Grotesk',system-ui,sans-serif}

  body[data-theme="botanical"]{
    --ink:#152a20; --text:#1d3529; --soft:#4f6a5c; --dim:#4c6055;
    --bg:#f2f7f3; --card:#ffffff; --panel-soft:#e6efe8; --line:rgba(21,42,32,.13);
    --pink:#2f7d5b; --orange:#6fae74; --grad:linear-gradient(105deg,#2f7d5b,#6fae74);
    --mint-bg:#dcefe2; --mint-bd:#b9dcc4; --mint-ink:#1f6144;
    --warm-bg:#f0ebe0; --warm-bd:#ddd2bd; --warm-ink:#6a5930;
    --cool-bg:#e5eef0; --cool-bd:#c7dade; --cool-ink:#2a5a64;
    --chrome:rgba(242,247,243,.9); --fade:#f2f7f3;
    /* a whisper of pattern, not wallpaper */
    background-image:radial-gradient(circle at 1px 1px, rgba(47,125,91,.10) 1px, transparent 0);
    background-size:22px 22px;
  }
  body[data-theme="botanical"] h1,body[data-theme="botanical"] h2,body[data-theme="botanical"] .hname{font-family:'Lora',Georgia,serif}

  /* Boutique: charcoal and champagne — the one theme that reads as luxury
     rather than as a colour scheme. */
  body[data-theme="boutique"]{
    --ink:#f4efe6; --text:#e6ded0; --soft:#b6ab98; --dim:#ada28a;
    --bg:#241f18; --card:#322b21; --panel-soft:#2a241c; --line:rgba(232,214,178,.16);
    --pink:#c9a227; --orange:#e6c66b; --grad:linear-gradient(105deg,#c9a227,#e6c66b);
    --warm-bg:#332c1e; --warm-bd:#4f452e; --warm-ink:#e8cf8a;
    --cool-bg:#26241f; --cool-bd:#3d3930; --cool-ink:#d8cfbb;
    --mint-bg:#1e2a24; --mint-bd:#2f4237; --mint-ink:#9fc9b1;
    --chrome:rgba(36,31,24,.9); --fade:#241f18;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  body[data-theme="boutique"] h1,body[data-theme="boutique"] h2,body[data-theme="boutique"] .hname{font-family:'Lora',Georgia,serif;letter-spacing:.005em}

  /* Mediterranean: sand and olive with a sea-blue accent — the holiday-let
     palette, and the one owners near the coast ask for. */
  body[data-theme="mediterranean"]{
    --ink:#2e2418; --text:#3a2f21; --soft:#6f6250; --dim:#726346;
    --bg:#fdf8f0; --card:#fffdf8; --panel-soft:#f4ecdd; --line:rgba(70,55,30,.14);
    --pink:#c1683f; --orange:#dda15e; --cyan:#2b7a91; --violet:#7a8b52;
    --grad:linear-gradient(105deg,#c1683f,#dda15e);
    --warm-bg:#f7e6d2; --warm-bd:#e6c9a4; --warm-ink:#8c4a22;
    --cool-bg:#e3eef1; --cool-bd:#c2dce3; --cool-ink:#215f72;
    --mint-bg:#eaeedd; --mint-bd:#d2dab8; --mint-ink:#4f6027;
    --chrome:rgba(253,248,240,.9); --fade:#fdf8f0;
  }
  body[data-theme="mediterranean"] h1,body[data-theme="mediterranean"] h2,body[data-theme="mediterranean"] .hname{font-family:'Lora',Georgia,serif}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.015em;line-height:1.1;color:var(--ink)}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;background:var(--chrome);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border-bottom:1px solid var(--line);box-shadow:0 12px 34px -26px rgba(20,16,30,.55)}
  .bar{display:flex;align-items:center;gap:14px;padding:14px 22px;max-width:1040px;margin:0 auto}
  /* The property's own photo when there is one — a monogram is what you show
     when you have no picture, and this page has had one all along in the hero.
     The ring and shadow keep a photo from reading as a hole in the header. */
  .hlogo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;
    font-family:'Fraunces';font-weight:700;font-size:22px;color:#fff;flex:none;letter-spacing:.01em;
    overflow:hidden;box-shadow:0 6px 18px -6px rgba(20,16,30,.32),inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.28)}
  .hlogo.hasimg{background-size:cover;background-position:center;font-size:0}
  .hlogo.haslogo{background:#fff;font-size:0}
  /* Fill the badge edge-to-edge (cover), so a square mark/app-icon/favicon has no
     white gutter. Non-square logos are centre-cropped; the white ground stays as a
     fallback behind any transparency. */
  .hlogo.haslogo img{width:100%;height:100%;object-fit:cover;padding:0}
  .hname{font-family:'Fraunces';font-weight:700;font-size:19.5px;color:var(--ink);line-height:1.08;letter-spacing:-.012em;font-optical-sizing:auto}
  .hpow{font-size:11px;color:var(--soft);letter-spacing:.012em;margin-top:2px;font-weight:500}
  .hpow-brand{font-weight:700;color:var(--pink);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  /* Inline SVG flag beside the picker. It can't go INSIDE the <option> —
     browsers render option text only — and a native <select> is worth keeping
     for the mobile picker, so the flag sits next to it and tracks the choice.
     (Emoji flags were showing as bare letter-pairs on Windows.) */
  .lang{margin-left:auto;display:flex;align-items:center;gap:8px}
  .lang select{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;outline:none;box-shadow:0 1px 2px rgba(20,16,30,.05);transition:border-color .15s,box-shadow .15s}
  .lang select:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line));box-shadow:0 2px 8px -3px rgba(20,16,30,.14)}
  .langflag{line-height:0;flex:none}
  .langflag svg{width:24px;height:16px;border-radius:3px;box-shadow:0 1px 3px rgba(20,16,30,.25);display:block}

  .welcome{padding:32px 0 4px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
  .welcome .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
  .welcome h1{font-size:clamp(28px,4.4vw,40px);margin:12px 0 12px}
  .welcome p{color:var(--soft);font-size:16px;max-width:480px}
  .hcard{position:relative;border-radius:24px;overflow:hidden;min-height:300px;display:flex;background:linear-gradient(140deg,var(--violet),var(--pink));background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:0 18px 44px rgba(20,16,30,.24)}
  .hc-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,16,27,.12) 0%,rgba(21,16,27,0) 40%,rgba(21,16,27,.55) 74%,rgba(21,16,27,.85) 100%)}
  .hc-body{position:relative;z-index:2;margin-top:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;color:#fff}
  .hc-name{font-family:'Fraunces';font-weight:700;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .hc-sub{color:rgba(255,255,255,.92);font-size:14px;font-weight:600}
  .hc-badges{display:flex;flex-wrap:wrap;gap:8px}
  .hc-badge{background:rgba(255,255,255,.15);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:#fff}

  .tabs{display:flex;gap:5px;width:fit-content;margin:24px auto 0;flex-wrap:wrap;justify-content:center}
  .tab{font-size:14px;font-weight:600;padding:11px 20px 14px;border-radius:14px 14px 0 0;color:var(--soft);cursor:pointer;border:1px solid var(--line);border-bottom:none;background:var(--panel-soft);background:color-mix(in srgb,var(--ink) 6%,var(--bg));font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .tab:not(.on){transform:translateY(4px);opacity:.92}
  .tab-dot{width:8px;height:8px;border-radius:50%}
  #tBook .tab-dot{background:var(--cyan)}#tWeek .tab-dot{background:var(--grad)}#tAsk .tab-dot{background:var(--grad-cool)}
  .tab.on{margin-bottom:-1px;z-index:3;padding-bottom:15px}.tab.on .tab-dot{background:var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  #tBook.on{background:var(--mint-bg);color:var(--mint-ink);border-color:var(--mint-bd)}
  #tWeek.on{background:var(--warm-bg);color:var(--warm-ink);border-color:var(--warm-bd)}
  #tAsk.on{background:var(--cool-bg);color:var(--cool-ink);border-color:var(--cool-bd)}
  .subpage{border:1px solid;border-radius:0 0 18px 18px;padding:16px 22px 26px;transition:background .2s,border-color .2s}
  .subpage.mint{background:var(--mint-bg);border-color:var(--mint-bd)}
  .subpage.warm{background:var(--warm-bg);border-color:var(--warm-bd)}
  .subpage.cool{background:var(--cool-bg);border-color:var(--cool-bd)}
  /* Plan my stay — trip board */
  .pl-ctrl{margin:2px 0 18px}
  .pl-lead{font-size:13.5px;color:var(--dim);margin:0 0 13px;line-height:1.5}
  .pl-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 11px}
  .pl-lbl{font-size:11.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-right:3px}
  .pl-chip{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--soft);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.15s}
  .pl-chip .pl-emo{opacity:.45;transition:opacity .15s}
  .pl-chip .pl-ck{display:none;font-weight:800;margin-left:1px}
  .pl-chip:hover{border-color:color-mix(in srgb,var(--ink) 34%,var(--line));color:var(--ink)}
  .pl-chip.on{color:#fff;background:var(--grad);border-color:transparent;font-weight:700;box-shadow:0 6px 15px -6px color-mix(in srgb,var(--pink) 65%,transparent)}
  .pl-chip.on .pl-emo{opacity:1}
  .pl-chip.on .pl-ck{display:inline}
  .pl-nu{font-family:inherit;font-size:14.5px;font-weight:700;color:var(--soft);background:transparent;border:1.5px solid var(--line);border-radius:11px;min-width:40px;height:40px;padding:0 8px;cursor:pointer;transition:.15s}
  .pl-nu:hover{border-color:color-mix(in srgb,var(--ink) 34%,var(--line));color:var(--ink)}
  .pl-nu.on{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 6px 15px -6px color-mix(in srgb,var(--pink) 65%,transparent)}
  .pl-days{display:grid;gap:14px;align-items:start;justify-content:center}
  .pl-day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
  .pl-dh{display:flex;align-items:center;gap:10px;padding:12px 15px;background:color-mix(in srgb,var(--pink) 8%,var(--card));border-bottom:1px solid var(--line)}
  .pl-dd{display:flex;flex-direction:column;line-height:1.04}
  .pl-wd{font-family:'Fraunces',serif;font-weight:700;font-size:19px;color:var(--ink);text-transform:capitalize}
  .pl-date{font-size:12px;color:var(--dim);font-weight:600;margin-top:2px}
  .pl-wx{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:16px;color:var(--soft)}
  .pl-wx b{font-size:13.5px;font-weight:700;color:var(--ink)}
  .pl-tip{font-size:12px;color:var(--dim);margin:0;padding:9px 15px 0}
  .pl-slot{padding:12px 14px 0}
  .pl-sl{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:8px}
  .pl-sl .pl-e{font-size:13px}
  .pl-items{display:flex;flex-direction:column;gap:9px}
  .pl-items .ev-res{padding:11px 12px;border-radius:13px}
  .pl-items .ev-res .thumb{width:82px;min-height:82px}
  .pl-items .pick-ph{height:74px}
  .pl-items .qdesc{-webkit-line-clamp:2}
  .pl-idea{display:flex;align-items:center;gap:11px;background:var(--panel-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
  .pl-idea .pl-ii{font-size:18px;flex:none}
  .pl-idea .pl-go{margin-left:auto;color:var(--dim)}
  .pl-free{font-size:13px;color:var(--dim);font-style:italic;padding:14px 15px}
  @media(max-width:720px){ .pl-days{grid-template-columns:1fr !important} }
  #book,#week,#ask{display:none}#book.on,#week.on,#ask.on{display:block}

  .wb-intro{color:var(--soft);font-size:15px;max-width:640px;margin:6px 0 4px}
  .wb-sec{font-family:'Fraunces';font-weight:600;font-size:20px;color:var(--ink);margin:24px 0 12px;padding-bottom:8px;position:relative}
  .wb-sec::after{content:'';position:absolute;left:0;bottom:0;width:40px;height:3px;border-radius:2px;background:var(--grad)}
  /* category subheading inside a picks section (Eat / Coffee / Drinks) */
  .hp-cat{font-family:'Fraunces';font-weight:600;font-size:15.5px;color:var(--soft);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
  .wb-sec + .hp-cat{margin-top:8px}
  .hp-cat .e{font-size:17px;line-height:1}
  /* Extras — owner add-ons a guest can request (a tap emails the owner) */
  .xtras{display:flex;flex-direction:column;gap:10px}
  .wxstrip{display:flex;align-items:stretch;gap:9px;margin:2px 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;scrollbar-width:thin}
  .wxstrip:empty{display:none}
  .wx-today{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 15px;box-shadow:var(--shadow);flex:none}
  .wx-today .wx-ic{font-size:30px;line-height:1}
  .wx-tl{font-family:'Fraunces';font-weight:600;font-size:16px;color:var(--ink)}
  .wx-ts{font-size:11.5px;color:var(--dim);margin-top:1px}
  .wx-days{display:flex;gap:7px}
  .wx-day{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 11px;min-width:50px;flex:none}
  .wx-wd{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .wx-di{font-size:19px;line-height:1}
  .wx-hl{font-size:12px;color:var(--ink);font-weight:600;white-space:nowrap}
  .wx-hl i{color:var(--dim);font-weight:400;font-style:normal;margin-left:3px}
  .wx-nudge{display:inline-block;font-size:13px;color:var(--ink);background:var(--panel-soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.4}
  .xtra{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
  .xtra:hover{border-color:rgba(255,61,139,.35);transform:translateY(-1px)}
  .xt-ic{flex:none;font-size:22px;width:44px;height:44px;display:grid;place-items:center;background:var(--panel-soft);border-radius:12px;line-height:1}
  .xt-b{flex:1;min-width:0}
  .xt-l{font-weight:700;font-size:15px;color:var(--ink)}
  .xt-p{font-size:13.5px;font-weight:700;color:var(--cyan);margin-top:2px}

var WX=null, wxTried=false;
function fetchWeather(){
  if(wxTried||!U||U.lat==null||U.lng==null)return;
  var la=Number(U.lat), lo=Number(U.lng);
  if(!isFinite(la)||!isFinite(lo)||(la===0&&lo===0))return;
  wxTried=true;
  var url='https://api.open-meteo.com/v1/forecast?latitude='+la.toFixed(4)+'&longitude='+lo.toFixed(4)
    +'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';
  fetch(url).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.daily&&d.daily.time&&d.daily.time.length){WX=d;paintWx();}
  }).catch(function(){});
}
function wxCat(code){code=+code;
  if(code===0||code===1)return 'clear';
  if(code>=95)return 'storm';
  if((code>=71&&code<=77)||code===85||code===86)return 'snow';
  if((code>=51&&code<=67)||(code>=80&&code<=82))return 'rain';
  return 'cloud';}

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function tomorrowISO(t){const d=new Date(t+'T12:00:00');d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const PLACEHOLDER_END=23*60+59;        // 23:59 in the data means "end unknown"
// Has TODAY's session finished? The same three rules the server applies in
// hasEndedToday, so a card and the pool that produced it can never disagree.
function endedToday(e){
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const mins=v=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(v||''));return m?(+m[1]*60+ +m[2]):null;};
  const s=mins(e.time), en=mins(e.endTime);
  if(s!=null&&en!=null&&en<=s&&s>=18*60&&en<=6*60)return false;   // overnight → still on
  if(en!=null&&en!==PLACEHOLDER_END&&(s==null||en>s))return en<=nowMin;
  if(s!=null)return s<(nowMin-240);                              // unknown end → 4h old
  return false;                                                  // no times → cannot tell
}
// Earliest date the event is still worth showing: today while today is still
// on, otherwise the next date of its run. A show that ends at 16:00 should not
// be wearing today's date at 23:00 — it is on again tomorrow, so say tomorrow.
function nextOccurrence(e){
  const t=todayISO();
  const min=endedToday(e)?tomorrowISO(t):t;
  const occ=Array.isArray(e.occurrenceDates)&&e.occurrenceDates.length?e.occurrenceDates:null;
  if(occ){let best='';for(const d of occ){if(d>=min&&(!best||d<best))best=d;}return best||e.date;}
  if(e.date&&e.date>=min)return e.date;
  const end=e.recurrenceEndDate||e.endDate||e.date;
  if(end&&end>=min)return min;                        // ongoing run → its next open day
  return e.date;
}

// recurring events with a weekly schedule → run range + per-weekday opening times
function recurrenceHtml(e){
  if(!e||e.eventType==='single'||!e.recurrenceSchedule)return '';
  const sch=e.recurrenceSchedule, days=sch.days;
  if(!days||typeof days!=='object'||Array.isArray(days))return '';
  const loc=LOCMAP[curLang]||'en-GB';
  const order=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  const dayName=i=>{try{return new Date(2024,0,1+i).toLocaleDateString(loc,{weekday:'long'});}catch(_){return order[i];}};  // 2024-01-01 = Monday
  const hhmm=s=>String(s||'').slice(0,5);
  // hours may be a single {start,end} OR an array of such slots (e.g. 10–12 & 14–16)
  const slots=h=>{const a=Array.isArray(h)?h:(h?[h]:[]);return a.filter(s=>s&&s.start).map(s=>hhmm(s.start)+' – '+hhmm(s.end)).join(', ');};
  let any=false;
  const rows=order.map((d,i)=>{
    const info=days[d];
    const open=!!(info&&info.is_open);
    if(open)any=true;
    const hrs=open?(slots(info.hours)||ml('open')):ml('closed');
    return `<div class="tt-row${open?'':' tt-closed'}"><span class="tt-day">${esc(dayName(i))}</span><span class="tt-hrs">${esc(hrs)}</span></div>`;
  }).join('');
  if(!any)return '';
  const runStart=sch.date_start||e.date, runEnd=e.recurrenceEndDate||sch.date_end;
  const runLine=(runStart&&runEnd&&runStart!==runEnd)?`<div class="mv-run">📅 ${esc(fmtDate(runStart))} – ${esc(fmtDate(runEnd))}</div>`:'';
  const appt=sch.is_also_by_appointment?`<div class="mv-appt">+ ${esc(ml('byAppt'))}</div>`:'';
  return `<div class="mv-tt"><h4>${esc(ml('tt'))}</h4>${runLine}<div class="tt-grid">${rows}</div>${appt}</div>`;
}

// ---- swipe navigation (mirrors the main app: 1:1 track drag following the
//      thumb, commit by distance OR velocity flick, rubber-band at the edges,
//      velocity-scaled settle). Buttons/arrow keys glide via the same track. ----
let swBusy=false;
function mvTrackEl(){return document.getElementById('mvTrack');}
function havePrevEv(){return modalIdx>0;}
function haveNextEv(){return modalIdx<modalList.length-1;}
function populateNeighbors(){
  const p=document.getElementById('mvPrev'), n=document.getElementById('mvNext');
  if(!p||!n)return;
  p.innerHTML=havePrevEv()?buildCardHTML(modalIdx-1):'';
  n.innerHTML=haveNextEv()?buildCardHTML(modalIdx+1):'';
}
function clearNeighbors(){
  const p=document.getElementById('mvPrev'), n=document.getElementById('mvNext');
  if(p)p.innerHTML=''; if(n)n.innerHTML='';
}
function setTrackPx(px){const t=mvTrackEl();if(t)t.style.transform=`translateX(calc(-33.3333% + ${px}px))`;}
function commitDir(dir,settleMs){        // dir: -1 prev, +1 next
  const t=mvTrackEl(); if(!t){modalIdx+=dir;showModal();return;}
  swBusy=true;
  if(!t.style.transform){                                // button/keyboard: no drag start yet —
    t.classList.add('mv-track-drag');                    // pin an explicit start (no transition)…
    t.style.transform='translateX(-33.3333%)';
    void t.offsetWidth;                                  // …and commit it so the glide actually animates
  }
  t.classList.remove('mv-track-drag'); t.classList.add('mv-track-anim');
  t.style.transitionDuration=(settleMs||280)+'ms';
  t.style.transform=dir<0?'translateX(0%)':'translateX(-66.6667%)';
  let done=false;
  const finish=()=>{ if(done)return; done=true; t.removeEventListener('transitionend',finish);
    modalIdx+=dir; showModal(true); swBusy=false; };   // rebuild at new index (no re-entrance anim)
  t.addEventListener('transitionend',finish);
  setTimeout(finish,(settleMs||280)+80);               // safety net
}
function snapBack(settleMs){
  const t=mvTrackEl(); if(!t)return;
  t.classList.remove('mv-track-drag'); t.classList.add('mv-track-anim');
  t.style.transitionDuration=(settleMs||280)+'ms';
  t.style.transform='';
  const done=()=>{ t.removeEventListener('transitionend',done); t.classList.remove('mv-track-anim'); t.style.transitionDuration=''; clearNeighbors(); };
  t.addEventListener('transitionend',done);
  setTimeout(done,(settleMs||280)+80);
}
function navModal(delta){        // buttons + arrow keys
  if(swBusy)return;
  const n=modalIdx+delta; if(n<0||n>=modalList.length)return;
  populateNeighbors();            // fill the target pane; commitDir reflows before gliding
  commitDir(delta,280);
}
(function initSwipe(){
  let sx=0,sy=0,st=0,lx=0,lt=0,vx=0,dragging=false,decided=false,pv=false,nx=false;
  mv.addEventListener('touchstart',ev=>{
    if(swBusy||ev.touches.length!==1)return;
    sx=lx=ev.touches[0].clientX; sy=ev.touches[0].clientY; st=lt=Date.now(); vx=0; dragging=false; decided=false;
  },{passive:true});
  mv.addEventListener('touchmove',ev=>{
    if(swBusy||!st||ev.touches.length!==1)return;
    const tc=ev.touches[0], dx=tc.clientX-sx, dy=tc.clientY-sy;
    if(!decided){
      const adx=Math.abs(dx),ady=Math.abs(dy);
      if(adx<10&&ady<10)return;
      decided=true;
      dragging=(adx>ady*1.2)&&modalList.length>1;      // horizontal intent + something to navigate to
      if(dragging){ populateNeighbors(); pv=havePrevEv(); nx=haveNextEv(); const t=mvTrackEl(); if(t){t.classList.remove('mv-track-anim');t.classList.add('mv-track-drag');} }
    }
    if(!dragging)return;
    if(ev.cancelable)ev.preventDefault();              // lock the gesture; let vertical scroll pass otherwise
    const now=Date.now(),dt=now-lt;
    if(dt>0){vx=vx*0.7+((tc.clientX-lx)/dt)*0.3;lx=tc.clientX;lt=now;}
    let d=dx; if((dx>0&&!pv)||(dx<0&&!nx))d=dx*0.32;   // rubber-band toward an empty edge
    setTrackPx(d);
  },{passive:false});
  mv.addEventListener('touchend',ev=>{
    if(swBusy)return;
    const wasDragging=dragging; st=0; dragging=false; decided=false;
    const t=mvTrackEl();
    if(!wasDragging){ if(t){t.classList.remove('mv-track-drag','mv-track-anim');t.style.transform='';} return; }
    const tc=ev.changedTouches[0];
    const dx=tc?tc.clientX-sx:0, adx=Math.abs(dx), width=window.innerWidth||400;
    const distanceCommit=adx>width*0.28;
    const velocityCommit=Math.abs(vx)>0.5&&adx>40&&(Math.sign(vx)===Math.sign(dx));

function weekDays(){const today=new Date();const out=[];
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()+i);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
  return out;}
// --- occurrence awareness: a recurring event (exhibition run, daily camp) is
// "on" every day it covers, not just its start_date — mirrors the search API. ---
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function occursOn(e,iso){
  if(!iso)return false;
  const occ=Array.isArray(e.occurrenceDates)&&e.occurrenceDates.length?e.occurrenceDates:null;
  if(occ)return occ.includes(iso);
  if(e.eventType==='recurring'){
    const start=e.date||'', end=e.recurrenceEndDate||e.endDate||e.date||'';
    if(start&&iso<start)return false;
    if(end&&iso>end)return false;
    const sch=e.recurrenceSchedule&&e.recurrenceSchedule.days;
    if(sch&&typeof sch==='object'&&!Array.isArray(sch)){
      const wd=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date(iso+'T12:00:00').getDay()];
      const info=sch[wd];return !!(info&&info.is_open);
    }
    return true;                        // recurring, within range, no weekday detail → assume it covers the day
  }
  const start=e.date||'', end=e.endDate||e.date||'';   // single / multi-day
  return (!start||iso>=start)&&(!end||iso<=end);
}

function timelineHTML(){
  const today=new Date(); const days=[];
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()+i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    days.push({iso,d,cnt:catalog.filter(e=>occursOn(e,iso)).length});}
  const max=Math.max(1,...days.map(x=>x.cnt));
  const bars=days.map(x=>{const h=6+Math.round((x.cnt/max)*38);const act=x.iso===activeDay?' active':'';
    return `<button class="tl-day${x.cnt===max&&x.cnt>0?' hot':''}${act}" data-date="${x.iso}"><span class="tl-wd">${(_WD[curLang]||_WD.en)[x.d.getDay()]}</span><span class="tl-dd">${x.d.getDate()}</span><span class="tl-bar" style="height:${h}px"></span><span class="tl-n">${x.cnt||''}</span></button>`;}).join('');
  return `<div class="tl-wrap"><span class="tl-lbl">${esc(chr('filterLbl'))}</span><button class="tl-reset${activeDay?' show':''}" id="tlReset">${esc(chr('allDays'))} ✕</button></div><div class="wk-timeline" id="tl">${bars}</div>`;
}

let activeDay=null;
function bindTimeline(){
  const tl=document.getElementById('tl'); if(!tl)return;
  tl.querySelectorAll('.tl-day').forEach(btn=>btn.addEventListener('click',()=>{
    const d=btn.getAttribute('data-date'); activeDay=(activeDay===d)?null:d; renderWeek();
  }));
  const reset=document.getElementById('tlReset');
  if(reset)reset.addEventListener('click',()=>{activeDay=null;renderWeek();});
}

function renderWeek(){
  const wk=weekDays();
  // an event is in-window if it OCCURS on the picked day (or any of the next 7 days by default) —
  // recurring runs count on every day they cover, not just their start_date
  const inWindow=e=>activeDay?occursOn(e,activeDay):wk.some(d=>occursOn(e,d));
  const showDateFor=e=>activeDay||nextOccurrence(e);      // picked day, else next upcoming occurrence
  const byShown=(a,b)=>String(showDateFor(a)||'').localeCompare(String(showDateFor(b)||''))||(km(a)-km(b));
  // "This week near your hotel": events on in the window, nearest first
  let nearPool=catalog.filter(inWindow).sort((a,b)=>km(a)-km(b));
  if(!activeDay&&nearPool.length<6)nearPool=[...catalog].sort((a,b)=>km(a)-km(b));
  const near=nearPool.slice(0,20).map(e=>evCard(e,showDateFor(e)));
  // themed: up to 20 of that category occurring in the window — soonest first
  const byCat=c=>catalog.filter(e=>e.categorySlug===c&&inWindow(e)).sort(byShown).slice(0,20).map(e=>evCard(e,showDateFor(e)));
  let html=timelineHTML();
  html+=section('📍',chr('near'),near);
  html+=section('🎶',chr('music'),byCat('music'));
  html+=section('🎨',chr('art'),byCat('exhibition'));
  html+=section('🎭',chr('theatre'),byCat('theatre'));
  document.getElementById('week').innerHTML=html||`<p class="empty">—</p>`;
  setupArrows(); bindTimeline();
}

// The place itself: its listing, with hours, photos and reviews. A place_id
// makes it exact; without one we fall back to coordinates, then to a name
// search, which is the only case that can still land on the wrong business.
function placeUrl(p,addr){
  var q=encodeURIComponent(p.n||'');
  if(p.gpid) return 'https://www.google.com/maps/search/?api=1&query='+q+'&query_place_id='+encodeURIComponent(p.gpid);
  if(isFinite(p.lat)&&isFinite(p.lng)) return 'https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng;
  return maps((p.n||'')+' '+(addr||''));
}

// What kind of place this is. Google's label is the most specific ("Lebanese
// restaurant"), OSM's cuisine next, and the category the owner filed it under
// last — that one is always present, so no card is left blank.
function pickKindLabel(p,kind){
  return p.gtype || p.cuisine || chr({dinner:'pkTDinner',coffee:'pkTCoffee',bar:'pkTBar'}[kind]) || '';
}

// The one pick card. Used by the concierge's answer and by the welcome book,
// so an improvement to one is an improvement to both.
function pickCard(p,kind,addr){
  // Older picks stored the distance in the note field; treat a note that is
  // only a distance as one, so they upgrade without a migration.
  var note=p.note||'', d=p.dist||'';
  if(!d&&/^\s*[\d.,]+\s*(m|km)\s*$/i.test(note)){ d=note.trim(); note=''; }
  var meta='';
  if(d){
    meta+='<span class="d">'+esc(d)+'</span>';
    var km=/km/i.test(d)?parseFloat(d.replace(',','.')):parseFloat(d)/1000;
    if(isFinite(km)&&km<=2.5)
      meta+='<span class="go">'+esc(chr('pkWalk').replace('{n}',Math.max(1,Math.round(km*12))))+'</span>';
  }
  var href=placeUrl(p,addr);            // the card opens the place
  // Real links, so a guest can actually phone the place or open its site.
  if(p.phone) meta+='<a href="tel:'+esc(String(p.phone).replace(/[^+\d]/g,''))+'">'+esc(chr('pkCall'))+'</a>';
  if(p.site)  meta+='<a href="'+esc(p.site)+'" target="_blank" rel="noopener">'+esc(chr('pkSite'))+'</a>';
  // Google's photo first, then whatever the venue publishes itself, then
  // the category mark. The proxy keeps the API key server-side.
  var photo=p.gphoto ? (API+'/apt?ph='+encodeURIComponent(p.gphoto)+'&w=280') : (p.img||'');
  var lead=photo
    ? '<img class="pick-ph" src="'+esc(photo)+'" alt="" decoding="async">'
    : '<span class="pick-ic">'+(ICON[kind]||'\ud83d\udccd')+'</span>';
  // Straight from OpenStreetMap, shown as recorded. No "open now": the tag
  // can be years old, and a confident wrong answer sends a guest to a
  // locked door.
  var extra='';
  if(p.grating){
    extra+='<span class="pick-h"><span class="pick-rate"><span class="st">★</span>'
      +esc(Number(p.grating).toFixed(1))
      +(p.gratings?'<span class="ct">('+esc(String(p.gratings))+')</span>':'')+'</span></span>';
  }
  if(p.hours) extra+='<span class="pick-h">'+esc(chr('pkHours'))+': '+esc(p.hours)+'</span>';
  if(p.addr)  extra+='<span class="pick-h">'+esc(p.addr)+'</span>';
  // Required attribution wherever the content came from Google.
  if(p.gphoto||p.grating)
    extra+='<span class="pick-src">'+esc(chr('pkVia'))
      +(p.gattr?' · '+esc(p.gattr):'')+'</span>';
  // A div, not an anchor: it contains links of its own now.
  return '<div class="pick" data-go="'+esc(href)+'">'
    +lead
    +'<span class="pick-b">'
    +(pickKindLabel(p,kind)?'<span class="pick-cu">'+esc(pickKindLabel(p,kind))+'</span>':'')
    +'<span class="pick-n">'+esc(p.n)+'</span>'
    +(note?'<span class="pick-note">'+esc(note)+'</span>':'')
    +'<span class="pick-m">'+meta+'</span>'+extra+'</span></div>';
}

// Every pick that knows where it is, whichever section it belongs to.
function mapPoints(){
  var out=[], seen={};
  var all=(U.content&&U.content.picks)||{};
  Object.keys(all).forEach(function(kind){

// What a pin says when it is opened. Lives beside the card builder rather than

function pickPoint(p,kind){

// An event pin carries the two things the card shows and the map cannot: when

function eventPoint(e){

  var where=[e.venue,e.city].filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}).join(' \u00b7 ');

// Worth its space only as a picture of a neighbourhood. Two located events at
// minimum, none of them further than this, and every located one plotted —
// a map showing three of eight claims more than it knows.
var EV_MAP_MAX_KM=25;
function eventPoints(list){
  var pts=(list||[]).filter(function(e){return isFinite(e.lat)&&isFinite(e.lng);});
  if(pts.length<2)return [];
  for(var i=0;i<pts.length;i++){ if(km(pts[i])>EV_MAP_MAX_KM)return []; }

// Which questions suit right now. A Friday evening offers dinner, a drink and
// something on tonight; a Sunday morning offers breakfast and a walk. Nothing
// here asks for the Wi-Fi password — that is already on screen, and a chip
// spent on it teaches a guest the concierge only repeats the page above.
// The undated three (this week, the weekend, concerts) fill whatever is left.
var CHIP_SLOT={breakfast:'am',coffee:'am',today:'am',
  kids:'pm',free:'pm',art:'pm',walk:'pm',
  surprise:'eve',dinner:'eve',bar:'eve',music:'eve',
  week:'',weekend:'',concert:''};
function chipSlotNow(){ var h=new Date().getHours(); return h<11?'am':(h<17?'pm':'eve'); }
// Slot by time of day only. Weather is deliberately NOT used here: a chip is a
// conversation starter, and we don't know which time window the guest has in mind —
// hiding "a nice walk" because it's raining right now presumes too much. Weather is
// applied REACTIVELY instead, in the concierge's answers (weatherReply + wet-day nudge).
function chipsForNow(){
  var pool=chr('chips')||{}, slot=chipSlotNow(), now=[], any=[];
  Object.keys(pool).forEach(function(k){
    var when=CHIP_SLOT[k]||'';
    if(when===slot)now.push(pool[k]); else if(!when)any.push(pool[k]);
  });
  return now.concat(any).slice(0,6);          // timely first, then the undated ones
}
// The placeholder cycles through what is NOT on a chip — that is where "I did
// not know I could ask that" comes from. It stops the moment a guest touches
// the field, so it never moves under them.
var _phTimers={};
function cyclePlaceholder(id){
  id=id||'ci';
  var inp=document.getElementById(id); if(!inp)return;
  clearInterval(_phTimers[id]);
  var pool=chr('chips')||{}, shown=chipsForNow();
  var rest=Object.keys(pool).map(function(k){return pool[k];})
    .filter(function(q){return shown.indexOf(q)<0;});
  if(!rest.length)return;
  var stop=function(){ clearInterval(_phTimers[id]); inp.placeholder=chr('ph'); };
  inp.addEventListener('focus',stop,{once:true});
  inp.addEventListener('input',stop,{once:true});
  var i=0;
  _phTimers[id]=setInterval(function(){
    if(!document.body.contains(inp)){clearInterval(_phTimers[id]);return;}
    inp.placeholder=rest[i++%rest.length];
  },4000);
}

/* ---------- rail scrolling ---------- */
function setupArrows(){
  var L='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  var R='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  [].slice.call(document.querySelectorAll('#week .wk-rail')).forEach(function(el){
    var page=function(){return Math.max(el.clientWidth*0.85,240);};
    if(!el.dataset.wheel){ el.dataset.wheel='1';
      el.addEventListener('wheel',function(e){
        // A vertical wheel scrolls the rail sideways, but only while it can still
        // move that way — at an edge the gesture goes back to the page, or a tall
        // rail under the cursor would swallow it and freeze the whole tab.
        if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
        var max=el.scrollWidth-el.clientWidth; if(max<=0)return;
        if((e.deltaY<0&&el.scrollLeft<=0)||(e.deltaY>0&&el.scrollLeft>=max-1))return;
        e.preventDefault(); el.scrollLeft+=e.deltaY;
      },{passive:false});
    }
    // Not latched on the measurement: a hidden panel measures zero, so this has
    // to stay retryable until the tab is actually shown.
    if(el.dataset.arrows)return;
    if(el.scrollWidth<=el.clientWidth+4)return;
    el.dataset.arrows='1';
    var wrap=document.createElement('div');wrap.className='wk-railwrap';
    el.parentNode.insertBefore(wrap,el);wrap.appendChild(el);
    var l=document.createElement('button');l.className='wk-arrow left';l.setAttribute('aria-label','Scroll left');l.innerHTML=L;
    var r=document.createElement('button');r.className='wk-arrow right';r.setAttribute('aria-label','Scroll right');r.innerHTML=R;
    wrap.appendChild(l);wrap.appendChild(r);
    var upd=function(){var max=el.scrollWidth-el.clientWidth-2;
      l.classList.toggle('show',el.scrollLeft>4);r.classList.toggle('show',el.scrollLeft<max);};
    l.onclick=function(){el.scrollBy({left:-page(),behavior:'smooth'});};
    r.onclick=function(){el.scrollBy({left:page(),behavior:'smooth'});};
    el.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);upd();
  });
}

var SEG_COL={music:'var(--pink)',festival:'var(--orange)',carnival:'var(--orange)',exhibition:'var(--violet)',
  theatre:'var(--violet)',dance:'var(--violet)',comedy:'var(--violet)',family:'var(--cyan)',sports:'var(--cyan)',sport:'var(--cyan)'};
const CAT_L={music:'music',exhibition:'art',theatre:'theatre',festival:'festival',family:'family'};
let catalog=[];
const evById={};                                   // id -> event, for the click-through modal
function indexEvents(list){for(const e of list){if(e&&e.id)evById[e.id]=e;}}
// clean ticket-tier / day-variant tails ("Rock Werchter 2026 | Saturday" → "Rock Werchter 2026")
function cleanTitle(x){
  let s=String(x||'').trim();
  const p=s.indexOf(' | '); if(p>0)s=s.slice(0,p).trim();
  s=s.replace(/\s*[-–]\s*(day\s*ticket|\d+\s*-?\s*day\s*pass|weekend\s*(pass|ticket)|combi\s*ticket|pass(es)?|vip|early\s*bird|terras?|parking\w*|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b.*$/i,'').trim();
  return s||String(x||'').trim();
}
function dedupe(list){const seen=new Set(),out=[];for(const e of list){const k=norm(cleanTitle(e.name))+'|'+norm(e.venue||e.city);if(k&&seen.has(k))continue;if(k)seen.add(k);out.push(e);}return out;}
function km(e){return (Number.isFinite(e.lat)&&Number.isFinite(e.lng))?haversine(U.lat,U.lng,e.lat,e.lng):999;}
// A street or town centroid is the right area and the wrong point — it put
// a club 4 km away 90 m from the door. Those coordinates still drive
// 'roughly near here'; they may not be quoted to the metre.
function distLabel(e){
  const k=km(e); if(!isFinite(k)||k>=999)return '';   // only when we actually have coords
  // "X min walk" only for an EXACT venue coord within walking range — a town/street
  // centroid would fake a "1 min walk" (see geo_precision), so imprecise coords stay as km.
  if(k<1.1&&(!e.geoPrecision||e.geoPrecision==='exact'))return Math.max(1,Math.round(k*12))+' '+chr('walk');
  return (k<10?k.toFixed(1):Math.round(k))+' km';
}
function haversine(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;const s=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');

/* ---------- "Plan my stay": the discovery layer ------------------------------
   A day-by-day plan composed from what shou already knows — live dated events,
   the forecast and the host's picks — with the host's own add-ons surfaced at
   the right stay-stage (arrival / checkout). Each slot carries an action today
   (an event link, or a Request that emails the host). A future 'book' action
   (affiliate / paid service) is a drop-in on the same slot, not a rewrite. --- */
var PLAN={days:2,interests:{food:true,cult:true,night:true,out:true,fam:false}};
function plt(k){var p=(CHR[curLang]&&CHR[curLang].plan)||CHR.en.plan;return (p&&p[k])||CHR.en.plan[k]||k;}
function addDaysISO(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function wxForDate(iso){if(!WX||!WX.daily||!WX.daily.time)return null;var i=WX.daily.time.indexOf(iso);
  if(i<0)return null;return {code:WX.daily.weather_code[i],hi:Math.round(WX.daily.temperature_2m_max[i])};}
var PLAN_INDOOR={exhibition:1,theatre:1};
var PLAN_ARRIVE=/early|check.?in|arriv|luggage|bag|storage|welcome|basket|grocer|course|einkauf|boodschap|spesa|compra|linen|towel|serviett|handdoek|handtuch|toalla|asciugam/;
var PLAN_LEAVE=/late|check.?out|depart|luggage|bag|storage|airport|aeroport|luchthaven|flughafen|aeropuerto|aeroporto|transfer|navette|taxi|clean|menage|schoonmaak|reinig|limpiez|puliz/;

function planPool(iso,wet,used){var cats=planCats();
  var list=catalog.filter(function(e){return e&&e.id&&!used[e.id]&&cats.indexOf(e.categorySlug)>=0&&occursOn(e,iso);});
  list.sort(function(a,b){if(wet){var ra=PLAN_INDOOR[a.categorySlug]?0:1,rb=PLAN_INDOOR[b.categorySlug]?0:1;if(ra!==rb)return ra-rb;}return km(a)-km(b);});
  return list;}
function planSlot(label,emoji,html){return '<div class="pl-slot"><div class="pl-sl"><span class="pl-e">'+emoji+'</span>'+esc(label)+'</div><div class="pl-items">'+html+'</div></div>';}
function planAddonChip(a){return '<div class="xtra"><span class="xt-ic">'+addonIcon(a.label)+'</span><div class="xt-b"><div class="xt-l">'+esc(txAddon(a.label))+'</div>'+(a.price?'<div class="xt-p">'+esc(a.price)+'</div>':'')+'</div><button type="button" class="xt-req" data-addon="'+esc(a.label)+'" data-label="'+esc(txAddon(a.label))+'" data-price="'+esc(a.price||'')+'">'+esc(chr('reqBtn'))+'</button></div>';}
function planStageAddons(re){var ads=((U.content&&U.content.addons)||[]).filter(function(a){return a&&a.label&&re.test(fold(a.label));});
  return ads.length?ads.map(planAddonChip).join(''):'';}
function planIdea(text,href){return '<a class="pl-idea" href="'+esc(href)+'" target="_blank" rel="noopener"><span class="pl-ii">🌳</span><span>'+esc(text)+'</span><span class="pl-go">↗</span></a>';}
function planDayHtml(i,days,used){
  var iso=addDaysISO(todayISO(),i),wx=wxForDate(iso),wet=wx&&wxWet(wx.code);
  var picks=(U.content&&U.content.picks)||{};
  var coffee=(picks.coffee||[]).filter(function(p){return p&&p.n;});
  var dinner=(picks.dinner||[]).filter(function(p){return p&&p.n;});
  var pool=planPool(iso,wet,used),rows='';
  if(i===0){var sa=planStageAddons(PLAN_ARRIVE);if(sa)rows+=planSlot(plt('settle'),'🧳',sa);}
  if(PLAN.interests.food&&coffee.length)rows+=planSlot(plt('morning'),'☕',pickCard(coffee[i%coffee.length],'coffee',U.address||''));
  var aft=pool.shift();
  if(aft){used[aft.id]=1;rows+=planSlot(plt('afternoon'),'📍',evCard(aft,iso));}
  else if(PLAN.interests.out&&!wet)rows+=planSlot(plt('afternoon'),'🌳',planIdea(plt('walkCap'),maps('parks near '+(U.address||U.building||'Brussels'))));
  var eve='';
  if(PLAN.interests.food&&dinner.length)eve+=pickCard(dinner[i%dinner.length],'dinner',U.address||'');
  var ee=pool.shift();if(ee){used[ee.id]=1;eve+=evCard(ee,iso);}
  if(eve)rows+=planSlot(plt('evening'),'🍽️',eve);
  if(i===days-1){var la=planStageAddons(PLAN_LEAVE);if(la)rows+=planSlot(plt('before'),'✈️',la);}
  if(!rows)rows='<div class="pl-free">'+esc(plt('freeDay'))+'</div>';
  var dt=new Date(iso+'T12:00:00'),loc=LOCMAP[curLang]||'en-GB';
  var wd=dt.toLocaleDateString(loc,{weekday:'short'}),dm=dt.toLocaleDateString(loc,{day:'numeric',month:'short'});
  var head='<div class="pl-dh"><div class="pl-dd"><span class="pl-wd">'+esc(wd)+'</span><span class="pl-date">'+esc(dm)+'</span></div>'+(wx?'<span class="pl-wx">'+wxIcon(wx.code)+'<b>'+wx.hi+'°</b></span>':'')+'</div>';
  var tip=wx?'<div class="pl-tip">'+esc(wet?plt('wetTip'):plt('fairTip'))+'</div>':'';
  return '<div class="pl-day">'+head+tip+rows+'</div>';
}
function planControls(){
  var order=[['food','🍽️','iFood'],['cult','🎨','iCult'],['night','🎶','iNight'],['out','🌳','iOut'],['fam','🧸','iFam']];
  var chips=order.map(function(o){return '<button type="button" class="pl-chip'+(PLAN.interests[o[0]]?' on':'')+'" data-int="'+o[0]+'"><span class="pl-emo">'+o[1]+'</span><span class="pl-lab">'+esc(plt(o[2]))+'</span><span class="pl-ck">✓</span></button>';}).join('');

function wirePlan(host){
  host.querySelectorAll('.pl-chip').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-int');PLAN.interests[k]=!PLAN.interests[k];renderPlan();};});
  host.querySelectorAll('.pl-nu').forEach(function(b){b.onclick=function(){PLAN.days=+b.getAttribute('data-days');renderPlan();};});
}
function renderPlan(){
  var host=document.getElementById('plan');if(!host)return;
  if(!(U.lat&&U.lng)){host.innerHTML='';return;}
  var used={},body='';
  for(var i=0;i<PLAN.days;i++)body+=planDayHtml(i,PLAN.days,used);
  var gtc=PLAN.days===1?'minmax(0,480px)':'repeat('+PLAN.days+',minmax(0,1fr))';
  host.innerHTML=planControls()+'<div class="pl-days" style="grid-template-columns:'+gtc+'">'+body+'</div>';
  wirePlan(host);
}

function loadEvents(){
  if(!(U.lat&&U.lng))return; // render() omits the tab entirely — nothing to fill.
  var cats=['music','exhibition','theatre','family','festival'];
  Promise.all(cats.map(function(c){return fetch(API+'/events?lang='+curLang+'&category='+c+'&sort=date&limit=60&lat='+U.lat+'&lng='+U.lng).then(function(r){return r.json();}).then(function(d){return d.events||[];}).catch(function(){return[];});}))
  .then(function(parts){
    // Round-robin, not concatenation: music comes back first and full, so a plain
    // concat made merged.slice(0,15) below a byte-for-byte copy of the music rail.
    var seen={},merged=[],mx=0;parts.forEach(function(a){if(a.length>mx)mx=a.length;});
    for(var i=0;i<mx;i++)parts.forEach(function(a){var e=a[i];if(e&&e.id&&e.name&&!seen[e.id]){seen[e.id]=1;merged.push(e);}});
    var wk=document.getElementById('week');if(!wk)return;
    if(!merged.length){wk.innerHTML='<div class="empty">'+esc(chr('noevents'))+'</div>';return;}
    // indexEvents is what makes a card clickable: the modal resolves data-id
    // through evById, so a catalog that is never indexed renders dead cards.
    catalog=dedupe(merged); indexEvents(catalog); activeDay=null; renderWeek(); if(curTab==='plan'&&typeof renderPlan==='function')renderPlan();
  });
}

function pickLead(kind,intentId){
  var tn=hostTone();
  var m=tn&&LEAD_TONE[tn]&&LEAD_TONE[tn][curLang]&&LEAD_TONE[tn][curLang][kind];
  if(m)return m;
  if(kind==='maps')return chr('nearby');

  return chr(kind==='one'?'hostpick1':'hostpicks');

  if(!el)return;

 {mk:['basket','welcome','bienvenue','welkom','willkommen','bienvenida','benvenuto','вітальн','grocer','course','boodschap','einkauf','compra','spesa','продукт'],kw:['welcome basket','groceries','stock the fridge','fill the fridge','panier de bienvenue','faire les courses','boodschappen','welkomstmand','willkommenskorb','einkaufe machen','cesta de bienvenida','hacer la compra','cesto di benvenuto','fare la spesa','вітальний кошик','купити продукти']}
];
function _fq(q){return ' '+toks(q)+' ';}
function _hitAny(s,arr){for(var i=0;i<arr.length;i++){var k=fold(arr[i]);if(k&&s.indexOf(k)>=0)return true;}return false;}
function activeAddons(){return ((U.content&&U.content.addons)||[]).filter(function(a){return a&&a.label;});}
function matchAddon(q){
  var ads=activeAddons(); if(!ads.length)return null; var s=_fq(q);
  for(var ci=0;ci<ADDON_CATS.length;ci++){var cat=ADDON_CATS[ci]; if(!_hitAny(s,cat.kw))continue;
    for(var ai=0;ai<ads.length;ai++){var lab=fold(ads[ai].label);
      if(cat.mk.some(function(m){return lab.indexOf(fold(m))>=0;}))return ads[ai];}}
  for(var aj=0;aj<ads.length;aj++){var ws=fold(ads[aj].label).split(' ').filter(function(w){return w.length>=5;});
    if(ws.some(function(w){return s.indexOf(' '+w)>=0;}))return ads[aj];}
  return null;
}
function relatedAddon(id){var mk={checkout:['late','tardif','tard','laat','spat','tardi'],checkin:['early','anticip','vroeg','fruh','tempran']}[id]; if(!mk)return null;
  var ads=activeAddons(); for(var i=0;i<ads.length;i++){var lab=fold(ads[i].label); if(mk.some(function(m){return lab.indexOf(fold(m))>=0;}))return ads[i];} return null;}
var BOOKD_KW=['book direct','book directly','book again','book with you','rebook','next time','next stay','come back','stay again','reserver en direct','reserver directement','prochaine fois','revenir','rechtstreeks boeken','opnieuw boeken','volgende keer','direkt buchen','nachstes mal','wiederkommen','reservar directo','proxima vez','volver','prenota diretto','prossima volta','tornare','забронювати напряму','наступного разу','повернутись'];
function isBookDirectQ(q){return _hitAny(_fq(q),BOOKD_KW);}
function addonReply(a){var _tl=txAddon(a.label);var m=addMsg('ai',esc(chr('addonLead').replace('{x}',_tl))+(a.price?' '+esc(a.price):''));var b=document.createElement('button');b.className='ex';b.type='button';b.textContent=chr('reqBtn');b.style.marginTop='8px';b.addEventListener('click',function(){openReqModal(_tl,a.price||'',a.label);});m.appendChild(b);}
// ---- Recent questions popup (mirrors the shou app's search-history dropdown) ----
var RECENT_KEY='apt_recent:'+(slug||'x'), RECENT_MAX=5, _recentAnchor=null, _recentGlobalWired=false;
function recentLoad(){try{var a=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');return Array.isArray(a)?a.filter(function(x){return typeof x==='string'&&x.trim();}).slice(0,RECENT_MAX):[];}catch(e){return [];}}
function recentPush(q){q=String(q||'').trim();if(!q)return;try{var a=recentLoad().filter(function(h){return h.toLowerCase()!==q.toLowerCase();});a.unshift(q);localStorage.setItem(RECENT_KEY,JSON.stringify(a.slice(0,RECENT_MAX)));}catch(e){}}
function closeRecent(){var dd=document.getElementById('recentDD');if(dd)dd.style.display='none';}
function openRecent(input){
  var rec=recentLoad(); if(!rec.length||!input){closeRecent();return;}
  var dd=document.getElementById('recentDD');
  if(!dd){dd=document.createElement('div');dd.id='recentDD';dd.className='recentdd';document.body.appendChild(dd);}
  dd.innerHTML='<div class="rdd-h">'+esc(chr('recentH'))+'</div>'+rec.map(function(q){return '<button type="button" class="rdd-i" data-q="'+esc(q)+'"><span class="rdd-ic">↻</span><span>'+esc(q)+'</span></button>';}).join('');
  var pos=function(){var r=(_recentAnchor||input).getBoundingClientRect();dd.style.top=(r.bottom+6)+'px';dd.style.left=r.left+'px';dd.style.width=r.width+'px';};
  pos(); dd.style.display='block';
  dd.querySelectorAll('.rdd-i').forEach(function(b){b.onclick=function(){closeRecent();setTab('ask');ask(b.getAttribute('data-q'));};});
  if(!dd._wired){window.addEventListener('scroll',function(){if(dd.style.display!=='none')pos();},{passive:true});window.addEventListener('resize',function(){if(dd.style.display!=='none')pos();});dd._wired=1;}
}
function maybeOpenRecent(input){ if(input&&input.value.trim()===''&&recentLoad().length)openRecent(input); else closeRecent(); }
function wireRecent(){
  ['ci','ti'].forEach(function(id){var el=document.getElementById(id);if(!el)return;
    el.addEventListener('focus',function(){_recentAnchor=el;maybeOpenRecent(el);});
    el.addEventListener('input',function(){if(el.value.trim()!=='')closeRecent();});});
  if(!_recentGlobalWired){_recentGlobalWired=true;
    document.addEventListener('mousedown',function(e){var dd=document.getElementById('recentDD');if(!dd||dd.style.display==='none')return;if(dd.contains(e.target)||e.target.id==='ci'||e.target.id==='ti')return;closeRecent();});}
}
function ask(q){
  if(!q||!q.trim()||asking)return;asking=true;
  recentPush(q); closeRecent();
  addMsg('me',esc(q));
  var cls=classify(q), w=(U.content&&U.content.welcome)||{};
  // log the intent — and flag welcome-book questions the owner hasn't filled in
  if(cls)logQ(cls.id,cls.t,!(cls.t==='wb'&&!String(w[cls.id]||'').trim()));
  else logQ('events','events',true);   // generic "what's on" → the events engine answers it, so bucket it as What's on (not Other)
  if(WX&&isWeatherQ(q)){weatherReply();asking=false;return;}
  if((U.content&&U.content.bookUrl)&&/^https?:/i.test(U.content.bookUrl)&&isBookDirectQ(q)){var _bm=addMsg('ai',esc(chr('bookLead')));var _ba=document.createElement('a');_ba.className='ex';_ba.href=U.content.bookUrl;_ba.target='_blank';_ba.rel='noopener';_ba.textContent=chr('bookGo');_ba.style.marginTop='8px';_ba.style.display='inline-block';_bm.appendChild(_ba);asking=false;return;}
  var _ad=matchAddon(q); if(_ad){addonReply(_ad);asking=false;return;}
  if(cls&&cls.t==='wb'&&String(w[cls.id]||'').trim()){
    var _wm=addMsg('ai',esc(chr('here'))+'<div class="ans"><span class="wb-ic">'+ICON[cls.id]+'</span><div><div class="k">'+esc(lbl(cls.id))+'</div><div class="v">'+esc(wval(cls.id))+'</div></div></div>');
    var _ra=relatedAddon(cls.id); if(_ra&&_wm){var _rl=txAddon(_ra.label);var _rb=document.createElement('button');_rb.className='ex';_rb.type='button';_rb.textContent=chr('reqBtn')+' — '+_rl+(_ra.price?' ('+_ra.price+')':'');_rb.style.marginTop='8px';_rb.addEventListener('click',function(){openReqModal(_rl,_ra.price||'',_ra.label);});_wm.appendChild(_rb);}
    asking=false;return;
  }
  // Matched a welcome-book question the host left blank. Saying so beats
  // handing it to the event search, which answered "how does the washing
  // machine work" with a storytelling afternoon about washerwomen 8 km away.
  if(cls&&cls.t==='wb'){
    var nm=addMsg('ai',esc(chr('nowb')));
    var ob=document.createElement('button');
    ob.className='ex';ob.type='button';ob.textContent=chr('nowbBtn');
    ob.style.marginTop='8px';
    ob.addEventListener('click',function(){setTab('book');});
    nm.appendChild(ob);
    asking=false;return;
  }
  maybeWxNudge(q);   // wet day + outdoor ask → a weather-aware line before the picks
  // The host's own picks beat a generic map search — that curation is the whole
  // point of a hosted apartment. Falls through when the owner has added none.
  if(cls&&cls.t==='rec'){
    var pk=(U.content&&U.content.picks)||{};
    var mixCats=MIX_INTENT[cls.id];   // breakfast → blend bakery + coffee picks
    var list=[];
    if(mixCats)mixCats.forEach(function(c){ (pk[c]||[]).forEach(function(p){ if(p&&p.n)list.push({p:p,c:c}); }); });
    else (pk[cls.id]||[]).forEach(function(p){ if(p&&p.n)list.push({p:p,c:cls.id}); });
    if(list.length){
      // Blended answers dedupe by name and interleave by distance; a single
      // category keeps the host's own order.
      if(mixCats){
        var pMeters=function(p){var s=String((p&&p.dist)||'').toLowerCase().replace(',','.');var m=s.match(/([\d.]+)\s*(km|m)\b/);if(!m)return 1e9;var v=parseFloat(m[1]);return m[2]==='km'?v*1000:v;};
        var seen={};
        list=list.filter(function(x){var k=String(x.p.n||'').toLowerCase();if(seen[k])return false;seen[k]=1;return true;})
                 .sort(function(a,b){return pMeters(a.p)-pMeters(b.p);});
      }
      var addr=U.address||'Brussels';
      var rows=list.map(function(x){return pickCard(x.p,x.c,addr);}).join('');
      // One map with every pick on it — the part that makes this read as places
      // rather than as a list. Only when we actually know where they are.
      // The same map as "Where you are", holding only what this answer named.
      var pts=list.filter(function(x){return isFinite(x.p.lat)&&isFinite(x.p.lng);})
                  .map(function(x){return pickPoint(x.p,x.c);});
      var mapId='', mapEl='';
      if(pts.length&&U.lat&&U.lng){
        mapId='askMap'+(++_askMapN);        // a conversation can hold several
        mapEl='<div class="pick-map" id="'+mapId+'"></div>';
      }
      // Category-aware and number-neutral, so it reads right for one pick or five.
      var kind=list.length===1?'one':'many';
      var moreQ=REC_Q[cls.id]||cls.id;
      // Lead shows instantly (fixed, category-aware), then swaps to an AI-written
      // one in the host's voice when a voice is set.
      var pickMsg=addMsg('ai','<div class="lead-ln"></div>'
        +'<div class="picks">'+rows+'</div>'+mapEl
        +'<a class="pick-more" href="'+esc(maps(moreQ+' near '+addr))+'" target="_blank" rel="noopener">'
        +esc(chr('pkAll'))+' \u2197</a>');
      if(pickMsg){
        pickMsg.className='msg ai wide';
        aiLeadSwap(pickMsg.querySelector('.lead-ln'),
          {kind:kind,lang:curLang,query:q,hotel:(U.name||''),
           picks:list.slice(0,6).map(function(x){return {name:x.p.n,cat:(lbl(x.c)||x.c),dist:x.p.dist,rating:x.p.grating};})},
          pickLead(kind,cls.id));
      }
      if(mapId)drawPlaceMap(mapId,pts);
      asking=false;return;
    }
  }
  if(cls&&(cls.t==='poi'||cls.t==='rec')){
    var near=U.address?(' near '+U.address):' Brussels';
    var qy=(cls.t==='poi'?({supermarket:'supermarket',pharmacy:'pharmacy',bakery:'bakery',transport:'metro tram',atm:'atm',attractions:'tourist attractions',taxi:'taxi rank'})[cls.id]:REC_Q[cls.id]);
    var fbody='<div class="ans"><span class="wb-ic">'+(ICON[cls.id]||'📍')+'</span><div><div class="k">'+esc(lbl(cls.id)||cls.id)+'</div><a href="'+esc(maps(qy+near))+'" target="_blank" rel="noopener">'+esc(chr('seemap'))+' ↗</a></div></div>';
    // Food intents with no host pick get a voiced "let's find you a spot" lead
    // (tone + AI); plain POIs keep the neutral "nearest options" line.
    if(cls.t==='rec'){
      var fm=addMsg('ai','<div class="lead-ln"></div>'+fbody);
      if(fm)aiLeadSwap(fm.querySelector('.lead-ln'),{kind:'maps',lang:curLang,query:q,hotel:(U.name||''),mapsLabel:(lbl(cls.id)||cls.id)},pickLead('maps',cls.id));
    } else {
      addMsg('ai',esc(chr('nearby'))+fbody);
    }
    asking=false;return;
  }
  var typing=document.createElement('div');typing.className='typing';typing.textContent=chr('thinking');document.getElementById('msgs').appendChild(typing);
  fetch(API+'/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,lang:curLang,lat:U.lat,lng:U.lng,source:'stay-'+(U.slug||'unit'),
    // Owner's chosen voice. Server-side enum — an unknown value is ignored,
    // so a stale or hand-edited value can only fall back to neutral.
    tone:((U.branding&&U.branding.tone)||null)})})
  .then(function(r){return r.json();}).then(function(d){
    typing.remove();addMsg('ai',esc(d.reasoning||'')||chr('none'));
    var list=[];var seen={};(d.events||[]).concat(d.suggestedEvents||[]).forEach(function(e){if(e&&e.id&&e.name&&!seen[e.id]){seen[e.id]=1;list.push(e);}});
    // Nearest first — the guest is anchored at the apartment, so a 5 km show beats a
    // 90 km one the shared search ranked highly on relevance alone. Guarded on coords.
    list=dedupe(list); if(U.lat!=null&&U.lng!=null)list.sort(function(a,b){return km(a)-km(b);});
    // Same title at several venues (a film showing at multiple cinemas) → keep only the
    // nearest showing, so "Ice Cream Man" doesn't fill the list three times over.
    var _seenT={}; list=list.filter(function(e){var tk=norm(cleanTitle(e.name||e.title||'')); if(!tk)return true; if(_seenT[tk])return false; _seenT[tk]=1; return true;});
    list=list.slice(0,8); indexEvents(list);
    if(list.length){var g=document.createElement('div');g.className='res';g.innerHTML=list.map(function(e){return evCard(e,nextOccurrence(e));}).join('');document.getElementById('msgs').appendChild(g);
      // Eight distances read one at a time is arithmetic; the same eight on a
      // map is a glance. Only when it can show all of them close enough to walk.
      var epts=eventPoints(list);
      if(epts.length){
        var emId='askMap'+(++_askMapN);
        var em=document.createElement('div'); em.className='pick-map'; em.id=emId;
        document.getElementById('msgs').appendChild(em);
        drawPlaceMap(emId,epts);
      }
      g.scrollIntoView({behavior:'smooth',block:'nearest'});}
    // Dead end → offer the LLM's follow-up chips instead of leaving the guest
    // stuck. The API only fills suggestionChips when nothing matched at all, and
    // the labels already come back in the guest's language. textContent (not
    // innerHTML) so a label can never inject markup.
    else if(Array.isArray(d.suggestionChips)&&d.suggestionChips.length){
      var sg=document.createElement('div');
      sg.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px';
      d.suggestionChips.slice(0,3).forEach(function(c){
        if(!c||!c.label||!c.query)return;
        var b=document.createElement('button');
        b.className='ex';b.type='button';b.textContent=c.label+' →';
        b.addEventListener('click',function(){ask(c.query);});
        sg.appendChild(b);
      });
      if(sg.children.length){document.getElementById('msgs').appendChild(sg);sg.scrollIntoView({behavior:'smooth',block:'nearest'});}
    }
    asking=false;
  }).catch(function(){typing.remove();addMsg('ai',chr('none'));asking=false;});
}
