<head>

<title>Guest Companion · powered by shou</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15101b; --text:#1a1622; --soft:#5b5566; --dim:#8a8494;
    --bg:#ffffff; --card:#ffffff; --panel-soft:#f7f5fa; --line:rgba(20,16,30,0.10);
    --pink:#ff3d8b; --orange:#ff9b3d; --cyan:#0e9a8d; --violet:#9b5cff;
    --grad:linear-gradient(105deg,var(--pink),var(--orange));
    --grad-cool:linear-gradient(120deg,var(--violet),var(--pink));
    --warm-bg:#fce4ed; --warm-bd:#f3bfd2; --warm-ink:#a02a54;
    --cool-bg:#ece5ff; --cool-bd:#d2c3f6; --cool-ink:#4e35a0;
    --mint-bg:#e3f4f1; --mint-bd:#bfe6df; --mint-ink:#0e6b60;
    --chrome:rgba(255,255,255,.9);   /* translucent sticky header */
    --fade:#ffffff;                  /* the fade behind the chat input */
    --shadow:0 1px 3px rgba(20,16,30,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* ---- themes: owner picks one; each is a variable override, never a layout
     change, so a bad choice can still only look different, not broken. ---- */
  body[data-theme="warm"]{
    --ink:#2b1b13; --text:#33241c; --soft:#6d5648; --dim:#9a8577;
    --bg:#fdf6ef; --card:#fffaf5; --panel-soft:#f6ebe0; --line:rgba(60,35,20,.13);
    --pink:#c2622f; --orange:#e0913f; --grad:linear-gradient(105deg,#c2622f,#e0913f);
    --warm-bg:#f7e3d3; --warm-bd:#e8c4a8; --warm-ink:#8a4218;
    --chrome:rgba(253,246,239,.9); --fade:#fdf6ef;
  }
  body[data-theme="warm"] h1,body[data-theme="warm"] h2,body[data-theme="warm"] .hname{font-family:'Lora',Georgia,serif}

  body[data-theme="nordic"]{
    --ink:#1b2430; --text:#26313d; --soft:#5d6b7a; --dim:#64717f;
    --bg:#f4f7f9; --card:#ffffff; --panel-soft:#e9eff4; --line:rgba(27,36,48,.12);
    --pink:#3d7ea6; --orange:#6aa3c0; --grad:linear-gradient(105deg,#3d7ea6,#6aa3c0);
    --cool-bg:#e2edf4; --cool-bd:#c3daea; --cool-ink:#255d80;
    --chrome:rgba(244,247,249,.9); --fade:#f4f7f9;
  }
  body[data-theme="nordic"] h1,body[data-theme="nordic"] h2,body[data-theme="nordic"] .hname{font-family:'Inter',system-ui,sans-serif;letter-spacing:-.02em}

  body[data-theme="bold"]{
    --ink:#f5f3f7; --text:#e8e4ee; --soft:#a9a2b6; --dim:#8a8299;
    --bg:#17141d; --card:#211d2a; --panel-soft:#1c1825; --line:rgba(255,255,255,.14);
    --pink:#ff4d8d; --orange:#ffb03d; --grad:linear-gradient(105deg,#ff4d8d,#ffb03d);
    --warm-bg:#3a2130; --warm-bd:#5a3247; --warm-ink:#ffb3cd;
    --cool-bg:#241f3a; --cool-bd:#3b3260; --cool-ink:#c9bcff;
    --mint-bg:#123330; --mint-bd:#1d4f49; --mint-ink:#7fd8cb;
    --chrome:rgba(23,20,29,.9); --fade:#17141d;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  body[data-theme="bold"] h1,body[data-theme="bold"] h2,body[data-theme="bold"] .hname{font-family:'Space Grotesk',system-ui,sans-serif}

  body[data-theme="botanical"]{
    --ink:#152a20; --text:#1d3529; --soft:#4f6a5c; --dim:#5c7166;
    --bg:#f2f7f3; --card:#ffffff; --panel-soft:#e6efe8; --line:rgba(21,42,32,.13);
    --pink:#2f7d5b; --orange:#6fae74; --grad:linear-gradient(105deg,#2f7d5b,#6fae74);
    --mint-bg:#dcefe2; --mint-bd:#b9dcc4; --mint-ink:#1f6144;
    --chrome:rgba(242,247,243,.9); --fade:#f2f7f3;
    /* a whisper of pattern, not wallpaper */
    background-image:radial-gradient(circle at 1px 1px, rgba(47,125,91,.10) 1px, transparent 0);
    background-size:22px 22px;
  }
  body[data-theme="botanical"] h1,body[data-theme="botanical"] h2,body[data-theme="botanical"] .hname{font-family:'Lora',Georgia,serif}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.015em;line-height:1.1;color:var(--ink)}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;background:var(--chrome);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:13px;padding:12px 20px;max-width:1040px;margin:0 auto}
  .hlogo{width:44px;height:44px;border-radius:12px;background:var(--grad-cool);display:grid;place-items:center;font-size:22px;flex:none}
  .hname{font-family:'Fraunces';font-weight:700;font-size:18px;color:var(--ink);line-height:1.05}
  .hpow{font-size:11px;color:var(--dim)}
  /* Inline SVG flag beside the picker. It can't go INSIDE the <option> —
     browsers render option text only — and a native <select> is worth keeping
     for the mobile picker, so the flag sits next to it and tracks the choice.
     (Emoji flags were showing as bare letter-pairs on Windows.) */
  .lang{margin-left:auto;display:flex;align-items:center;gap:8px}
  .lang select{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;outline:none}
  .langflag{line-height:0;flex:none}
  .langflag svg{width:24px;height:16px;border-radius:3px;box-shadow:0 1px 3px rgba(20,16,30,.25);display:block}

  .welcome{padding:32px 0 4px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
  .welcome .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
  .welcome h1{font-size:clamp(28px,4.4vw,40px);margin:12px 0 12px}
  .welcome p{color:var(--soft);font-size:16px;max-width:480px}
  .hcard{position:relative;border-radius:20px;overflow:hidden;min-height:300px;display:flex;background:linear-gradient(140deg,var(--violet),var(--pink));background-size:cover;background-position:center;box-shadow:0 18px 44px rgba(20,16,30,.24)}
  .hc-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,16,27,.12) 0%,rgba(21,16,27,0) 40%,rgba(21,16,27,.55) 74%,rgba(21,16,27,.85) 100%)}
  .hc-body{position:relative;z-index:2;margin-top:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;color:#fff}
  .hc-name{font-family:'Fraunces';font-weight:700;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .hc-sub{color:rgba(255,255,255,.92);font-size:14px;font-weight:600}
  .hc-badges{display:flex;flex-wrap:wrap;gap:8px}
  .hc-badge{background:rgba(255,255,255,.15);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:#fff}

  .tabs{display:flex;gap:5px;width:fit-content;margin:24px auto 0;flex-wrap:wrap;justify-content:center}
  .tab{font-size:14px;font-weight:600;padding:11px 20px 14px;border-radius:14px 14px 0 0;color:var(--soft);cursor:pointer;border:1px solid var(--line);border-bottom:none;background:#f1eff3;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .tab:not(.on){transform:translateY(4px);opacity:.92}
  .tab-dot{width:8px;height:8px;border-radius:50%}
  #tBook .tab-dot{background:var(--cyan)}#tWeek .tab-dot{background:var(--grad)}#tAsk .tab-dot{background:var(--grad-cool)}
  .tab.on{margin-bottom:-1px;z-index:3;padding-bottom:15px}.tab.on .tab-dot{background:var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  #tBook.on{background:var(--mint-bg);color:var(--mint-ink);border-color:var(--mint-bd)}
  #tWeek.on{background:var(--warm-bg);color:var(--warm-ink);border-color:var(--warm-bd)}
  #tAsk.on{background:var(--cool-bg);color:var(--cool-ink);border-color:var(--cool-bd)}
  .subpage{border:1px solid;border-radius:0 0 18px 18px;padding:16px 22px 26px;transition:background .2s,border-color .2s}
  .subpage.mint{background:var(--mint-bg);border-color:var(--mint-bd)}
  .subpage.warm{background:var(--warm-bg);border-color:var(--warm-bd)}
  .subpage.cool{background:var(--cool-bg);border-color:var(--cool-bd)}
  #book,#week,#ask{display:none}#book.on,#week.on,#ask.on{display:block}

  .wb-intro{color:var(--soft);font-size:15px;max-width:640px;margin:6px 0 4px}
  .wb-sec{font-family:'Fraunces';font-weight:600;font-size:20px;color:var(--ink);margin:24px 0 12px;padding-bottom:8px;position:relative}
  .wb-sec::after{content:'';position:absolute;left:0;bottom:0;width:40px;height:3px;border-radius:2px;background:var(--grad)}
  .wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .wb-card{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
  a.wb-card{transition:border-color .15s,transform .15s}a.wb-card:hover{border-color:rgba(255,61,139,.4);transform:translateY(-1px)}
  .wb-ic{font-size:20px;flex:none;line-height:1.3}
  .wb-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .wb-v{font-size:14px;color:var(--ink);font-weight:500;line-height:1.45}
  .wb-go{margin-left:auto;align-self:center;color:var(--cyan);font-weight:700;font-size:15px;flex:none;padding-left:6px}

  .wk-h{font-family:'Fraunces';font-weight:600;font-size:22px;margin:22px 0 14px;display:flex;align-items:center;gap:10px;color:var(--ink);position:relative;padding-bottom:10px}
  .wk-h::after{content:'';position:absolute;left:0;bottom:0;width:42px;height:3px;border-radius:2px;background:var(--grad)}
  .wk-h .cnt{font-size:12px;font-weight:700;color:var(--soft);background:rgba(20,16,30,.05);border-radius:999px;padding:2px 9px;margin-left:auto}
  .rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
  .ev{flex:0 0 300px;display:flex;gap:14px;align-items:center;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:.15s}
  .ev:hover{box-shadow:0 8px 22px rgba(20,16,30,.1);transform:translateY(-2px)}
  .thumb{width:78px;height:78px;border-radius:12px;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--violet),var(--pink))}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ev .t{font-family:'Fraunces';font-weight:600;font-size:17px;line-height:1.15;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ev .d{font-weight:700;font-size:12px;color:var(--cyan)}
  .ev .vn{color:var(--soft);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .empty{text-align:center;color:var(--dim);padding:24px 0}

  .chat{max-width:720px;margin:6px auto 0}
  .chat-intro{text-align:center;color:var(--soft);font-size:15px;margin-bottom:16px}
  .exs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:2px 1px 12px}
  .ex{font-size:13px;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;white-space:nowrap}
  .ex:hover{border-color:rgba(255,61,139,.45);color:var(--pink)}
  .msgs{display:flex;flex-direction:column;gap:13px;margin-bottom:8px;min-height:60px}
  .msg{max-width:88%;font-size:14.5px;line-height:1.5;padding:12px 16px;border-radius:16px}
  .msg.me{align-self:flex-end;background:var(--grad);color:#fff;font-weight:500;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:5px}
  .picks{display:flex;flex-direction:column;gap:7px;margin:9px 0 4px}
  .pick{display:flex;flex-direction:column;gap:2px;padding:10px 13px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);text-decoration:none;color:inherit}
  .pick:hover{border-color:var(--cyan)}
  .pick-n{font-weight:700;font-size:14.5px}
  .pick-t{font-size:13px;color:var(--soft)}
  .pick-more{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none}
  .ans{display:flex;gap:12px;align-items:flex-start;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .ans .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .ans .v{font-size:14px;color:var(--ink);font-weight:500}
  .ans a{color:var(--cyan);font-weight:700;text-decoration:none;font-size:13px}
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:6px}
  .chatform{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(to top,var(--fade) 75%,transparent);padding:10px 0 14px}
  .chatform input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-family:inherit;font-size:15px;outline:none;box-shadow:var(--shadow)}
  .chatform input:focus{border-color:rgba(255,61,139,.5)}
  .chatform button{background:var(--grad);color:#fff;border:none;border-radius:14px;padding:0 22px;font-weight:700;font-size:15px;cursor:pointer}
  .typing{color:var(--dim);font-size:13px;padding:6px 4px}

  footer{text-align:center;padding:34px 20px;color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:22px}
  footer b{font-family:'Fraunces';font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .loading{text-align:center;padding:80px 20px;color:var(--dim)}
  @media(max-width:760px){.welcome{grid-template-columns:1fr;gap:20px}.ev{flex:0 0 82vw}}
</style>
</head>

    // concat made merged.slice(0,15) below a byte-for-byte copy of the music rail.
    var seen={},merged=[],mx=0;parts.forEach(function(a){if(a.length>mx)mx=a.length;});
    for(var i=0;i<mx;i++)parts.forEach(function(a){var e=a[i];if(e&&e.id&&e.name&&!seen[e.id]){seen[e.id]=1;merged.push(e);}});
    var wk=document.getElementById('week');if(!wk)return;
    if(!merged.length){wk.innerHTML='<div class="empty">'+esc(chr('noevents'))+'</div>';return;}
    function rail(title,list){if(!list.length)return'';return '<h2 class="wk-h">'+esc(title)+'<span class="cnt">'+list.length+'</span></h2><div class="rail">'+list.map(evCard).join('')+'</div>';}
    var byCat=function(c){return merged.filter(function(e){return e.categorySlug===c;}).slice(0,15);};
    wk.innerHTML=rail(chr('near'),merged.slice(0,15))+rail('🎶 '+chr('music'),byCat('music'))+rail('🎨 '+chr('art'),byCat('exhibition'))+rail('🎭 '+chr('theatre'),byCat('theatre'));
  });
}

// ---- concierge ----
var fold=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};
function toks(q){return ' '+fold(q).replace(/[^0-9a-zа-яіїєґё]+/gi,' ').trim()+' ';}
var INTENTS=[
  {t:'wb',id:'wifi',kw:['wifi','wi fi','internet','password','mot de passe','wachtwoord','passwort','wlan','contrasena','clave wifi','parola','пароль','код wifi']},
  {t:'wb',id:'checkout',kw:['check out','checkout','departure','depart','leave','uitchecken','vertrek','auschecken','abreise','salida','partenza','check out ora','виїзд','коли виїзд']},
  {t:'wb',id:'checkin',kw:['check in','checkin','arrival','arrive','arrivee','door code','key','keys','sleutel','schlussel','anreise','llave','chiave','entrada','ключ','заїзд']},
  {t:'wb',id:'heating',kw:['heating','heat','thermostat','chauffage','verwarming','heizung','riscaldamento','calefaccion','froid','cold','холодно','опалення']},
  {t:'wb',id:'laundry',kw:['laundry','washing machine','washer','lave linge','wasmachine','waschmaschine','lavadora','lavatrice','пральна','прати']},
  {t:'wb',id:'coffee',kw:['coffee machine','nespresso','espresso machine','machine a cafe','koffiezetapparaat','kaffeemaschine','cafetera','macchina caffe','capsule','кавомашина']},
  {t:'wb',id:'trash',kw:['trash','garbage','rubbish','recycling','waste','poubelle','dechet','afval','mull','abfall','basura','rifiuti','сміття']},
  {t:'wb',id:'luggage',kw:['luggage','suitcase','drop bag','store bag','bagage','koffer','valise','gepack','maleta','bagaglio','deposito bagagli','багаж']},
  {t:'wb',id:'parking',kw:['parking','park the car','where to park','garage','voiture','parkeren','parkeer','parkplatz','aparcamiento','parcheggio','паркінг']},
  {t:'wb',id:'rules',kw:['house rules','smoking','smoke','parties','noise','quiet hours','pets','reglement','fumer','huisregels','rauchen','normas','fumar','regole','fumare','правила']},
  {t:'wb',id:'emergency',kw:['emergency','ambulance','police','hospital','doctor','urgence','noodgeval','notfall','krankenhaus','emergencia','emergenza','ospedale','host number','надзвичайн','лікарня']},
  {t:'poi',id:'supermarket',kw:['supermarket','grocery','groceries','buy food','courses','boodschappen','supermarkt','einkaufen','supermercado','comprar comida','spesa','fare la spesa','продукти','купити їжу']},
  {t:'poi',id:'pharmacy',kw:['pharmacy','pharmacie','chemist','apotheek','apotheke','farmacia','аптека']},
  {t:'poi',id:'bakery',kw:['bakery','bread','croissant','boulangerie','bakker','backerei','panaderia','panetteria','пекарня','хліб']},
  {t:'poi',id:'transport',kw:['tram','metro','bus','public transport','subway','u bahn','station','openbaar vervoer','transporte','trasporti','метро','транспорт']},
  {t:'poi',id:'atm',kw:['atm','cash machine','cash','withdraw money','distributeur','geldautomaat','bankomat','cajero','bancomat','банкомат','готівка']},
  // NB: no bare 'que faire' / 'wat te doen' here — those are generic "what's on"
  // questions ("Que faire ce soir ?"), which belong to the events engine, not a
  // static sightseeing map link. Keep only genuinely sightseeing-y wording.
  {t:'poi',id:'attractions',kw:['attractions','sightseeing','tourist','what to see','a voir','visiter','bezienswaardigheden','sehenswurdigkeiten','que ver','cosa vedere','visitare','визначні пам']},
  {t:'poi',id:'taxi',kw:['taxi','cab','uber','bolt','такси','таксі']},
  {t:'rec',id:'dinner',kw:['dinner','dine','restaurant','where to eat','good food','lunch','diner','manger','eten','essen','abendessen','restaurante','ristorante','comer','mangiare','cena','cenar','ресторан','поїсти','вечеря','повечеряти']},
  {t:'rec',id:'breakfast',kw:['breakfast','brunch','petit dejeuner','ontbijt','fruhstuck','desayun','colazione','сніданок']},
  {t:'rec',id:'coffee',kw:['coffee shop','good coffee','best coffee','cafe','cappuccino','koffie','kaffee','caffe','кава']},
  {t:'rec',id:'bar',kw:['bar','drinks','cocktail','beer','pub','biere','borrel','bier','cerveza','birra','copa','aperitivo','пиво','бар']},
];
function classify(q){var s=toks(q);for(var i=0;i<INTENTS.length;i++){var it=INTENTS[i];for(var j=0;j<it.kw.length;j++){var k=fold(it.kw[j]);var hit=(k.indexOf(' ')>=0||k.length>=5)?s.indexOf(k)>=0:s.indexOf(' '+k+' ')>=0;if(hit)return it;}}return null;}
var REC_LEAD={dinner:{en:'For dinner, the host recommends:',fr:"Pour dîner, l'hôte recommande :",nl:'Om te eten raadt je gastheer aan:',de:'Zum Essen empfiehlt der Gastgeber:',es:'Para comer, el anfitrión recomienda:',it:"Per mangiare, l'host consiglia:",uk:'Поїсти господар радить:'},coffee:{en:'For coffee, the host recommends:',fr:"Pour un café, l'hôte recommande :",nl:'Voor koffie raadt je gastheer aan:',de:'Für einen Kaffee empfiehlt der Gastgeber:',es:'Para un café, el anfitrión recomienda:',it:"Per un caffè, l'host consiglia:",uk:'На каву господар радить:'},bar:{en:'For a drink, the host recommends:',fr:"Pour un verre, l'hôte recommande :",nl:'Voor een drankje raadt je gastheer aan:',de:'Für einen Drink empfiehlt der Gastgeber:',es:'Para una copa, el anfitrión recomienda:',it:"Per un drink, l'host consiglia:",uk:'Випити господар радить:'}};
var REC_Q={dinner:'restaurants',breakfast:'breakfast brunch',coffee:'coffee',bar:'bars'};

// Aggregate-only signal for the owner's "what guests asked" digest: the matched
// intent id, never the question itself. Fire-and-forget; never blocks the guest.
function logQ(intent,kind,answered){
  try{
    if(!U||!U.slug)return;
    fetch(API+'/apt',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'log_q',slug:U.slug,intent:intent,kind:kind,lang:curLang,answered:answered!==false})}).catch(function(){});
  }catch(e){}
}

var asking=false;
function addMsg(cls,html){var el=document.createElement('div');el.className='msg '+cls;el.innerHTML=html;document.getElementById('msgs').appendChild(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});return el;}
function ask(q){
  if(!q||!q.trim()||asking)return;asking=true;
  addMsg('me',esc(q));
  var cls=classify(q), w=(U.content&&U.content.welcome)||{};
  // log the intent — and flag welcome-book questions the owner hasn't filled in
  if(cls)logQ(cls.id,cls.t,!(cls.t==='wb'&&!String(w[cls.id]||'').trim()));
  else logQ('other','events',true);
  if(cls&&cls.t==='wb'&&w[cls.id]){
    addMsg('ai',esc(chr('here'))+'<div class="ans"><span class="wb-ic">'+ICON[cls.id]+'</span><div><div class="k">'+esc(lbl(cls.id))+'</div><div class="v">'+esc(wval(cls.id))+'</div></div></div>');
    asking=false;return;
  }
  // The host's own picks beat a generic map search — that curation is the whole
  // point of a hosted apartment. Falls through when the owner has added none.
  if(cls&&cls.t==='rec'){
    var picks=((U.content&&U.content.picks)||{})[cls.id]||[];
    if(picks.length){
      var addr=U.address||'Brussels';
      var rows=picks.map(function(p){
        return '<a class="pick" href="'+esc(maps(p.n+' '+addr))+'" target="_blank" rel="noopener">'
          +'<span class="pick-n">'+esc(p.n)+'</span>'
          +(p.note?'<span class="pick-t">'+esc(p.note)+'</span>':'')+'</a>';
      }).join('');
      // Category-aware and number-neutral, so it reads right for one pick or five.
      var lead=(REC_LEAD[cls.id]&&(REC_LEAD[cls.id][curLang]||REC_LEAD[cls.id].en))
               ||chr(picks.length===1?'hostpick1':'hostpicks');
      addMsg('ai',esc(lead)
        +'<div class="picks">'+rows+'</div>'
        +'<a class="pick-more" href="'+esc(maps(REC_Q[cls.id]+' near '+addr))+'" target="_blank" rel="noopener">'
        +esc(chr('seemap'))+' \u2197</a>');
      asking=false;return;
    }
  }
  if(cls&&(cls.t==='poi'||cls.t==='rec')){
    var near=U.address?(' near '+U.address):' Brussels';
    var qy=(cls.t==='poi'?({supermarket:'supermarket',pharmacy:'pharmacy',bakery:'bakery',transport:'metro tram',atm:'atm',attractions:'tourist attractions',taxi:'taxi rank'})[cls.id]:REC_Q[cls.id]);
    addMsg('ai',esc(chr('nearby'))+'<div class="ans"><span class="wb-ic">'+(ICON[cls.id]||'📍')+'</span><div><div class="k">'+esc(lbl(cls.id)||cls.id)+'</div><a href="'+esc(maps(qy+near))+'" target="_blank" rel="noopener">'+esc(chr('seemap'))+' ↗</a></div></div>');
    asking=false;return;
  }
  var typing=document.createElement('div');typing.className='typing';typing.textContent=chr('thinking');document.getElementById('msgs').appendChild(typing);
  fetch(API+'/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,lang:curLang,lat:U.lat,lng:U.lng,source:'stay-'+(U.slug||'unit'),
    // Owner's chosen voice. Server-side enum — an unknown value is ignored,
    // so a stale or hand-edited value can only fall back to neutral.
    tone:((U.branding&&U.branding.tone)||null)})})
  .then(function(r){return r.json();}).then(function(d){
    typing.remove();addMsg('ai',esc(d.reasoning||'')||chr('none'));
    var list=[];var seen={};(d.events||[]).concat(d.suggestedEvents||[]).forEach(function(e){if(e&&e.id&&e.name&&!seen[e.id]){seen[e.id]=1;list.push(e);}});
    list=list.slice(0,8);
    if(list.length){var g=document.createElement('div');g.className='res';g.innerHTML=list.map(evCard).join('');document.getElementById('msgs').appendChild(g);g.scrollIntoView({behavior:'smooth',block:'nearest'});}
    // Dead end → offer the LLM's follow-up chips instead of leaving the guest
    // stuck. The API only fills suggestionChips when nothing matched at all, and
    // the labels already come back in the guest's language. textContent (not
    // innerHTML) so a label can never inject markup.
    else if(Array.isArray(d.suggestionChips)&&d.suggestionChips.length){
      var sg=document.createElement('div');
      sg.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px';
      d.suggestionChips.slice(0,3).forEach(function(c){
        if(!c||!c.label||!c.query)return;
        var b=document.createElement('button');
        b.className='ex';b.type='button';b.textContent=c.label+' →';
        b.addEventListener('click',function(){ask(c.query);});
        sg.appendChild(b);
      });
      if(sg.children.length){document.getElementById('msgs').appendChild(sg);sg.scrollIntoView({behavior:'smooth',block:'nearest'});}
    }
    asking=false;
  }).catch(function(){typing.remove();addMsg('ai',chr('none'));asking=false;});
}
</script>
