<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — shou apartments</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15101b;--soft:#5b5566;--dim:#8a8494;--line:rgba(20,16,30,.14);--pink:#ff3d8b;--orange:#ff9b3d;--grad:linear-gradient(105deg,var(--pink),var(--orange))}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f1f8;font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding:24px 16px;line-height:1.55}
  .bar{max-width:760px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bar h1{font-family:'Fraunces';font-size:19px;font-weight:600}
  .btn{margin-left:auto;font-family:inherit;font-weight:700;font-size:14px;padding:10px 18px;border:none;border-radius:11px;background:var(--grad);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  .back{font-size:13.5px;color:var(--soft);text-decoration:none}
  .sheet{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px 46px;box-shadow:0 18px 44px -20px rgba(20,16,30,.3)}
  .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px}
  .brand{font-family:'Fraunces';font-weight:700;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .doc{text-align:right}
  .doc h2{font-family:'Fraunces';font-size:24px;font-weight:600}
  .doc .no{font-size:14px;color:var(--soft);margin-top:2px}
  .parties{display:flex;gap:36px;flex-wrap:wrap;margin-bottom:28px}
  .party{flex:1;min-width:220px;font-size:13.5px}
  .party .lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .party .nm{font-weight:700;font-size:15px;margin-bottom:3px}
  .party .ln{color:var(--soft);white-space:pre-line}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
  td{padding:12px 8px 12px 0;border-bottom:1px solid rgba(20,16,30,.07)}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .totals{margin-left:auto;width:290px;margin-top:14px;font-size:14px}
  .totals .r{display:flex;justify-content:space-between;padding:6px 0}
  .totals .r.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
  .paid{display:inline-block;margin-top:18px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0e9a8d;background:rgba(14,154,141,.12);border-radius:999px;padding:5px 13px}
  .foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);white-space:pre-line}
  .warn{max-width:760px;margin:0 auto 16px;background:#fff6ec;border:1px solid #ffd8ad;border-radius:14px;padding:14px 18px;font-size:13.5px}
  .state{max-width:760px;margin:60px auto;text-align:center;color:var(--soft)}
  @media print{
    body{background:#fff;padding:0}
    .bar,.warn{display:none}
    .sheet{box-shadow:none;border:none;border-radius:0;max-width:none;padding:0}
    @page{margin:16mm}
  }
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="/apartments/dashboard" data-i="dash">← Dashboard</a>
    <h1 style="margin-left:12px" data-i="invoice">Invoice</h1>
    <button class="btn" onclick="window.print()" data-i="print">Print / Save as PDF</button>
  </div>
  <div id="warn"></div>
  <div id="out"><div class="state" data-i="loading">Loading…</div></div>

<script>
const API='https://shou-backend.vercel.app/api/apt';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=c=>((c||0)/100).toFixed(2).replace('.',',');

// ---------- i18n (owner UI: EN / FR / NL, same three as the dashboard) ----------
var T={
 en:{dash:'← Dashboard',invoice:'Invoice',print:'Print / Save as PDF',from:'From',billTo:'Bill to',descr:'Description',net:'Net',vat:'VAT',total:'Total',paid:'Paid {d} — no payment due',loading:'Loading…',signin:'Please {a}sign in{/a} to view this invoice.',notCfg:'— not configured —'},
 fr:{dash:'← Tableau de bord',invoice:'Facture',print:'Imprimer / Enregistrer en PDF',from:'De',billTo:'Facturé à',descr:'Description',net:'Net',vat:'TVA',total:'Total',paid:'Payé le {d} — aucun paiement dû',loading:'Chargement…',signin:'Veuillez vous {a}connecter{/a} pour consulter cette facture.',notCfg:'— non renseigné —'},
 nl:{dash:'← Dashboard',invoice:'Factuur',print:'Afdrukken / Opslaan als PDF',from:'Van',billTo:'Factuur voor',descr:'Omschrijving',net:'Netto',vat:'Btw',total:'Totaal',paid:'Betaald op {d} — niets meer verschuldigd',loading:'Laden…',signin:'{a}Meld je aan{/a} om deze factuur te bekijken.',notCfg:'— niet ingesteld —'}
};
// The emailed ?t= link cannot carry a language (apt_owners has no language column),
// so the choice the dashboard stored on this same origin is what makes FR/NL stick.
// ?lang= stays as a manual override.
var L=new URLSearchParams(location.search).get('lang')
      ||(function(){try{return localStorage.getItem('apt_ui_lang');}catch(e){return null;}})()
      ||(navigator.language||'en').slice(0,2).toLowerCase();
if(!T[L])L='en';
document.documentElement.lang=L;
// tr(), not the dashboard's t() — `t` is already the signed-link query param below.
function tr(k){var d=T[L];return d[k]!=null?d[k]:T.en[k];}
document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=tr(el.getAttribute('data-i'));});

function fmt(d){if(!d)return '';try{return new Date(d).toLocaleDateString(L==='en'?'en-GB':L,{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
// Printed only when the buyer is outside Belgium — a Belgian address on a
// Belgian invoice does not need restating. Falls back to the raw code.
function countryName(cc){try{return new Intl.DisplayNames([L],{type:'region'}).of(cc)||cc;}catch(e){return cc;}}

(async function(){
  // Two ways in: the signed link from the invoice email (?t=), or a signed-in
  // owner opening it from the dashboard (?id=). Never a guessable number.
  const qs=new URLSearchParams(location.search);
  const t=qs.get('t'), id=qs.get('id');
  // apt_sess holds the whole session envelope — read it exactly like dashboard.html.
  let token=''; try{ const s=JSON.parse(localStorage.getItem('apt_sess')||'null'); if(s&&s.token) token=s.token; }catch(e){}
  let body, headers={'Content-Type':'application/json'};
  if(t){ body={action:'invoice',t:t}; }
  else if(id&&token){ body={action:'invoice',id:Number(id)}; headers['Authorization']='Bearer '+token; }
  else { out.innerHTML='<div class="state">'+tr('signin').replace('{a}','<a href="/apartments/dashboard">').replace('{/a}','</a>')+'</div>'; return; }

  const r=await fetch(API,{method:'POST',headers:headers,body:JSON.stringify(body)});
  const j=await r.json().catch(function(){return {};});
  if(!r.ok){out.innerHTML='<div class="state">'+esc((j&&j.error)||'Could not load this invoice.')+'</div>';return;}

  const inv=j.invoice, b=j.buyer, s=j.seller;
  // A preview must never be mistakable for a real invoice — the marker is part
  // of the sheet itself and is deliberately NOT hidden by the print stylesheet.
  const previewBanner='';
  // Never print a placeholder company — if the seller block is unconfigured we
  // say so, because an invoice with invented identity details is worthless.
  if(!j.seller){
    document.getElementById('warn').innerHTML=
      '<b>Seller details not set.</b> Add your company name, address and VAT number to <code>app_config.crm_seller</code> before issuing this to a customer — the invoice below is incomplete without them.';
  }
  const PLAN={solo:'Solo',host:'Host',pro:'Pro'};
  const desc='shou apartments — '+(PLAN[inv.plan]||'subscription')+' (monthly)';
  out.innerHTML=
   '<div class="sheet">'
   +previewBanner
   +'<div class="top"><div><div class="brand">shou</div>'
     +(s?'<div style="font-size:13px;color:var(--soft);margin-top:6px">'+esc(s.name)+'</div>':'')
   +'</div>'
   +'<div class="doc"><h2>'+tr('invoice')+'</h2><div class="no">'+esc(inv.no)+'</div>'
     +'<div class="no">'+fmt(inv.invoiced_at||inv.paid_at)+'</div></div></div>'

   +'<div class="parties">'
     +'<div class="party"><div class="lbl">'+tr('from')+'</div>'
       +(s?'<div class="nm">'+esc(s.name)+'</div><div class="ln">'+esc(s.address||'')+'</div>'
           +(s.vat?'<div class="ln">'+tr('vat')+' '+esc(s.vat)+'</div>':'')
           +(s.email?'<div class="ln">'+esc(s.email)+'</div>':'')
          :'<div class="ln">'+tr('notCfg')+'</div>')
     +'</div>'
     +'<div class="party"><div class="lbl">'+tr('billTo')+'</div>'
       +'<div class="nm">'+esc(b.name||'')+'</div>'
       +'<div class="ln">'+esc(b.address||'')+'</div>'
       +(b.country&&b.country!=='BE'?'<div class="ln">'+esc(countryName(b.country))+'</div>':'')
       +(b.vat?'<div class="ln">'+tr('vat')+' '+esc(b.vat)+'</div>':'')
     +'</div>'
   +'</div>'

   +'<table><thead><tr><th>'+tr('descr')+'</th><th class="num">'+tr('net')+'</th><th class="num">'+tr('vat')+'</th><th class="num">'+tr('total')+'</th></tr></thead>'
   +'<tbody><tr><td>'+esc(desc)+'</td>'
     +'<td class="num">€ '+eur(inv.net_cents)+'</td>'
     +'<td class="num">'+(inv.vat_rate||21)+'% · € '+eur(inv.vat_cents)+'</td>'
     +'<td class="num">€ '+eur(inv.gross_cents)+'</td></tr></tbody></table>'

   +'<div class="totals">'
     +'<div class="r"><span>'+tr('net')+'</span><span>€ '+eur(inv.net_cents)+'</span></div>'
     +'<div class="r"><span>'+tr('vat')+' '+(inv.vat_rate||21)+'%</span><span>€ '+eur(inv.vat_cents)+'</span></div>'
     +'<div class="r tot"><span>'+tr('total')+'</span><span>€ '+eur(inv.gross_cents)+'</span></div>'
   +'</div>'
   +(inv.status==='paid'?'<div class="paid">'+tr('paid').replace('{d}',fmt(inv.paid_at))+'</div>':'')
   // .foot is white-space:pre-line, so real newlines break the lines — and building
   // from the non-empty parts keeps a missing note from leaving a blank first line.
   +'<div class="foot">'+[(s&&s.note)||'',(s&&s.iban)?'IBAN '+s.iban:'','powered by shou · shou.be'].filter(Boolean).map(esc).join('\n')+'</div>'
   +'</div>';
  document.title=tr('invoice')+' '+inv.no+' — shou';
})();
</script>
</body>
</html>
